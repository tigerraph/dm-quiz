<!doctype html>
<!--
  Harness for tools/test-qr-join.mjs: opens the app in a phone-sized iframe on the
  same origin (the mock server), so a headless Chrome with --dump-dom can tap through
  it. Query: u = app URL, lang = preset language, name = type this and tap the join
  button, open = then let the host open a lobby (round number). The result is
  written to <pre id="out"> as JSON.
-->
<meta charset="utf-8">
<iframe id="f" style="width:380px;height:800px;border:0"></iframe>
<pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById("f");
const out = {};
const peek = () => {
  const w = f.contentWindow, d = f.contentDocument;
  let phase = "?"; try { phase = w.eval("phase"); } catch (e) {}
  return { phase, url: w.location.href, h1: (d.querySelector("h1") || {}).textContent || "",
           nameField: !!d.getElementById("pname"), joinBtn: !!d.getElementById("go"),
           signUp: !!d.querySelector('input[type="password"]') };
};
const waitFor = async (pred, ms) => { for (let t = 0; t < ms; t += 100) { try { if (pred()) return true; } catch (e) {} await sleep(100); } return false; };
(async () => {
  try {
    localStorage.clear();
    if (q.get("lang")) localStorage.setItem("dmq_lang", JSON.stringify(q.get("lang")));
    f.src = q.get("u");
    await waitFor(() => { const p = peek().phase; return p && p !== "boot" && p !== "?"; }, 8000);
    await sleep(600);
    out.first = peek();
    if (q.get("name")) {
      const d = f.contentDocument;
      d.getElementById("pname").value = q.get("name");
      d.getElementById("go").click();
      await sleep(2500);
      out.afterJoin = peek();
      out.waiting = f.contentWindow.eval("waitingRound");
      if (q.get("open")) {
        await fetch("/rest/v1/dm_state", { method: "POST", headers: { apikey: "mock", Authorization: "Bearer mock",
          "Content-Type": "application/json", "Content-Profile": "dm" },
          body: JSON.stringify({ session: new URL(q.get("u"), location.href).searchParams.get("session"),
            phase: "lobby", q_index: -1, round: Number(q.get("open")), started_at: new Date().toISOString() }) });
        await sleep(4000);
        out.afterOpen = peek();
        out.token = f.contentWindow.eval("myToken");
      }
    }
  } catch (e) { out.error = String(e); }
  document.getElementById("out").textContent = JSON.stringify(out);
})();
</script>
