# Supabase free-tier projects pause after ~7 days without API activity.
# Democracy Matters meets roughly monthly, so the project would sleep
# before every session. This pings it twice a week.
#
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon/public key (never the service_role key,
#                      never the database password)
name: keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Select one row from dm_scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/dm_scores?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code"
            cat /tmp/body
            exit 1
          fi
          echo "Project is awake."
