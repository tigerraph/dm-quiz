# Supabase free-tier projects pause after ~7 days without API activity.
# Democracy Matters meets roughly monthly, so the project would sleep
# before every session. This runs twice a week — well inside the 7-day
# window and inside the «every 5 days» Rafa asked for on 24.09.2026.
#
# 24.09.2026: a run used to pass on the status code alone, so an empty or
# refused read looked identical to a real one. It now fails unless the
# response is a JSON array with at least one row, and prints the count.
# The row itself is never printed: the body may carry participant data.
#
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon/public key (never the service_role key,
#                      never the database password)
name: keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Select one row from dm_state (real read, row count asserted)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/dm_state?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code"
            # the body may name the table or the policy, never a key
            head -c 300 /tmp/body
            exit 1
          fi
          rows=$(python3 -c 'import json,sys; d=json.load(open("/tmp/body")); print(len(d) if isinstance(d,list) else -1)')
          echo "rows returned: $rows"
          if [ "$rows" -lt 1 ]; then
            echo "::error::200 but no row came back — the read did not touch data, so it does not count as activity."
            exit 1
          fi
          echo "Project is awake: one real row read from dm_state."
