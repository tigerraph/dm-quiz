:root{
  /* DM / DAY8 tokens — verified against DM_Format_Learning-Loop deck */
  --blue:#435CC6; --green:#A8D272; --teal:#5EB9A9;
  --cream:#FDF2D0; --dark:#1B2329; --ink:#22313C;
  --blue-deep:#33489e; --dark-2:#232c33;
  /* Not from the DM deck — the palette has no red, but a quiz needs a "wrong"
     signal that reads at a glance. Muted terracotta, tuned to sit beside the
     green without shouting. Change here if the brand ever settles on one. */
  --wrong:#DB6A57;
  --paper-shadow:0 6px 18px rgba(0,0,0,.32);
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  min-height:100dvh; background:var(--dark); color:#fff;
  font-family:'Poppins','Segoe UI',system-ui,sans-serif; font-weight:400;
  -webkit-font-smoothing:antialiased;
}
h1,h2,.xb{font-weight:800; letter-spacing:-.01em;}
#app{max-width:660px; margin:0 auto; padding:14px 16px calc(22px + env(safe-area-inset-bottom));
     min-height:100dvh; display:flex; flex-direction:column;}
body.host #app{max-width:none; padding:0;}

/* ---------- shared ---------- */
.kicker{font-weight:800; font-size:.82rem; letter-spacing:.02em; color:var(--teal);}
.btn{
  display:inline-block; border:none; cursor:pointer; text-decoration:none;
  font-family:inherit; font-weight:800; font-size:1.02rem;
  color:#fff; background:var(--blue); padding:14px 30px; border-radius:999px;
  box-shadow:0 4px 0 var(--blue-deep); transition:transform .12s ease;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--blue-deep);}
.btn.small{padding:11px 18px; font-size:.9rem; border-radius:12px; box-shadow:0 3px 0 var(--blue-deep);}
.btn.ghost{background:transparent; color:#fff; box-shadow:inset 0 0 0 2px var(--teal);}
.btn.ghost:active{transform:translateY(3px); box-shadow:inset 0 0 0 2px var(--teal);}
.btn:disabled{opacity:.55; cursor:default;}
.btn:focus-visible,.tile:focus-visible,.pill:focus-visible,
.namewrap input:focus-visible,.picker a:focus-visible{outline:3px solid var(--teal); outline-offset:3px;}
.namewrap input:focus{outline:3px solid var(--teal); outline-offset:2px; border-color:transparent;}
.pills{display:flex; gap:8px; justify-content:center;}
.pill{
  font-family:inherit; font-weight:800; font-size:.8rem; letter-spacing:.06em;
  color:rgba(255,255,255,.75); background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.28); border-radius:999px; padding:6px 15px; cursor:pointer;
}
.pill.on{color:var(--ink); background:var(--teal); border-color:var(--teal);}
.iconbtn{width:36px; height:36px; border-radius:11px; border:1.5px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08); color:#fff; font-size:1rem; cursor:pointer; line-height:1; padding:0;}
.corner{position:fixed; top:calc(10px + env(safe-area-inset-top)); right:14px; display:flex; gap:8px; z-index:6;}

/* The DM/DAY8 mark beside the name, matching the deck's lockup. The mark is
   white artwork, so it only ever sits on the dark ground or a colour panel. */
.wordmark{font-weight:800; letter-spacing:-.005em; white-space:nowrap;
          display:inline-flex; align-items:center; gap:.55em;}
.wordmark .wmlogo{height:1.75em; width:auto; flex:0 0 auto; display:block;}
.wordmark .wm2{color:var(--teal);}
.hostleft .wordmark .wmlogo,.hostq .wordmark .wmlogo{height:2.7em;}

/* ---------- centred screens ---------- */
.screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
        text-align:center; gap:16px; padding:20px 0;}
.screen h1{font-size:clamp(1.9rem,8.5vw,3rem); line-height:1.04; margin:0;}
.sub{color:rgba(255,255,255,.82); font-size:1rem; max-width:40ch; margin:0;}
.rules{color:rgba(255,255,255,.62); font-size:.84rem; max-width:42ch; margin:0;}
.brandline{font-weight:800; font-size:.8rem; letter-spacing:.04em; color:rgba(255,255,255,.6);}
.namewrap{display:flex; gap:8px; width:min(94%,360px);}
.namewrap input{
  flex:1; min-width:0; border-radius:12px; border:1.5px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08); color:#fff; padding:13px 15px; font:inherit; font-weight:600;
}
.namewrap input::placeholder{color:rgba(255,255,255,.55);}
.picker{display:flex; flex-direction:column; gap:10px; width:min(94%,400px);}
.picker a{
  display:block; text-decoration:none; text-align:left; padding:14px 16px; border-radius:var(--radius);
  background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.16); color:#fff; font-weight:700;
}
.picker a small{display:block; font-weight:600; font-size:.78rem; color:rgba(255,255,255,.55); margin-top:2px;}

/* ---------- top bar ---------- */
.top{display:flex; align-items:center; gap:10px; padding:2px 0 12px;}
.top .qcount{color:rgba(255,255,255,.7); font-size:.85rem; font-weight:700; margin-left:auto; white-space:nowrap;}
.scorechip{background:rgba(255,255,255,.1); border-radius:999px; padding:5px 12px;
  font-weight:800; font-size:.85rem; white-space:nowrap;}
.langcycle{border:1.5px solid rgba(255,255,255,.28); background:transparent; color:rgba(255,255,255,.8);
  font-family:inherit; font-weight:800; font-size:.72rem; border-radius:9px; padding:6px 9px;
  cursor:pointer; letter-spacing:.06em;}

/* ---------- question ---------- */
.stage{flex:1; display:flex; flex-direction:column; gap:14px;}
.timer{height:9px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden; flex:0 0 auto;}
.timer i{display:block; height:100%; width:100%; background:var(--teal); border-radius:999px;}
.timer.low i{background:var(--cream);}
.qimg{display:flex; justify-content:center;}
.qimg img{max-height:min(30dvh,320px); max-width:100%; border-radius:10px;}
.qtext{font-weight:800; font-size:clamp(1.15rem,5.2vw,1.6rem); line-height:1.2;
       text-align:center; margin:auto 2px; text-wrap:balance;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:auto;}
.grid.n2{grid-template-columns:1fr 1fr;}
.grid.n3 .tile:last-child{grid-column:1/-1;}
.tile{
  position:relative; border:none; cursor:pointer; text-align:left;
  display:flex; align-items:center; gap:11px; min-height:74px; padding:14px 14px;
  background:var(--cream); color:var(--ink); border-radius:4px; box-shadow:var(--paper-shadow);
  font-family:inherit; font-weight:600; font-size:clamp(.92rem,3.6vw,1.05rem); line-height:1.25;
  transition:transform .12s ease, opacity .25s ease, filter .25s ease;
}
.tile:nth-child(odd){transform:rotate(-.9deg);}
.tile:nth-child(even){transform:rotate(.9deg);}
.tile:active{transform:translateY(2px);}
.tile .badge{
  flex:0 0 auto; width:28px; height:28px; border-radius:7px; background:var(--blue); color:#fff;
  font-weight:800; font-size:.92rem; display:flex; align-items:center; justify-content:center;
}
.tile.dim{opacity:.3; filter:saturate(.35);}
.tile.lose{background:var(--wrong); color:#fff;}
.tile.lose .badge{background:rgba(0,0,0,.28);}
.tile.mine{box-shadow:0 0 0 3px var(--teal), var(--paper-shadow);}
.tile.win{background:var(--green); box-shadow:0 0 0 3px #fff, var(--paper-shadow);}
.tile.win .badge{background:var(--ink);}
.tile.win::after{content:"\2713"; position:absolute; top:7px; right:11px; font-weight:800; font-size:1.05rem;}
.tile.lose::after{content:"\2715"; position:absolute; top:7px; right:11px; font-weight:800; font-size:1.05rem;}
@keyframes popin{from{transform:translateY(10px) scale(.96); opacity:0;} to{opacity:1;}}

/* ---------- reveal ---------- */
.banner{text-align:center; border-radius:var(--radius); padding:11px 15px; font-weight:800; font-size:1.02rem;}
.banner.good{background:rgba(168,210,114,.22); box-shadow:inset 0 0 0 1.5px var(--green); color:var(--green);}
.banner.bad{background:rgba(219,106,87,.18); box-shadow:inset 0 0 0 1.5px var(--wrong); color:var(--wrong);}
.banner small{display:block; font-size:.82rem; font-weight:600; color:rgba(255,255,255,.75); margin-top:3px;}
.banner .pts{color:#fff; font-size:1.2rem;}
/* the Learning Loop "Check" beat */
.why{background:var(--cream); color:var(--ink); border-radius:var(--radius); padding:13px 16px;
     font-size:.94rem; line-height:1.45; text-align:left; box-shadow:var(--paper-shadow);}
.why b{display:block; font-weight:800; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
       color:var(--blue); margin-bottom:4px;}
.nextrow{display:flex; justify-content:center; gap:10px; margin-top:auto; padding-top:4px;}
.stage.rev{gap:12px;}
.stage.rev .qtext{margin:0 2px; font-size:1rem; font-weight:600; opacity:.85;}
.stage.rev .grid{margin-top:0;}

/* ---------- answer distribution ---------- */
.dist{display:flex; flex-direction:column; gap:8px;}
.dbar{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center;}
.dbar .dl{width:26px; height:26px; border-radius:7px; background:rgba(255,255,255,.14); color:#fff;
          font-weight:800; font-size:.85rem; display:flex; align-items:center; justify-content:center;
          flex:0 0 auto;}
.dbar .dt{background:rgba(255,255,255,.09); border-radius:8px; height:34px; position:relative; overflow:hidden;}
.dbar .df{position:absolute; inset:0 auto 0 0; background:rgba(255,255,255,.22); border-radius:8px;
          transition:width .5s cubic-bezier(.2,.7,.3,1);}
.dbar .dlab{position:absolute; inset:0; display:flex; align-items:center; padding:0 11px;
            font-weight:600; font-size:.92rem; color:#fff; white-space:nowrap; overflow:hidden;
            text-overflow:ellipsis;}
.dbar .dn{font-weight:800; font-variant-numeric:tabular-nums; min-width:3.4ch; text-align:right;
          display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;}
.dbar .dn small{font-weight:600; font-size:.66em; color:rgba(255,255,255,.5);}
.dbar.win .dl{background:var(--green); color:var(--ink);}
.dbar.win .df{background:var(--green);}
.dbar.win .dlab{color:var(--ink);}
/* an empty winning bar has no green behind the text, so ink on the dark
   track is unreadable — keep the label light until the fill is there */
.dbar.win.empty .dlab{color:#fff;}
.dbar.win.empty .dn{color:var(--green);}
.dbar.win .dn{color:var(--green);}
.dbar.win .dn small{color:rgba(168,210,114,.7);}
.dbar.mine .dl{box-shadow:0 0 0 2.5px var(--teal);}
.dbar.lose .df{background:rgba(219,106,87,.55);}

/* ---------- end / leaderboard ---------- */
.bignum{font-weight:800; font-size:clamp(3rem,15vw,4.4rem); line-height:1; margin:0;}
.metriclbl{font-weight:800; font-size:.8rem; color:var(--teal); margin:0;}
.board{width:min(94%,400px); background:rgba(255,255,255,.06); border-radius:12px; padding:12px 15px;
       font-size:.9rem;}
.boardtitle{font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:.66rem;
            color:var(--teal); margin-bottom:7px;}
.brow{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; line-height:1.9;
      align-items:baseline;}
.brow .bk{font-weight:800; color:var(--teal); min-width:1.6em;}
.brow .bn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left;}
.brow .bs{font-weight:800; font-variant-numeric:tabular-nums;}
.brow.me .bn,.brow.me .bs,.brow.me .bk{color:var(--green); font-weight:800;}
.brow.lead .bk{color:var(--green);}

/* roster chips */
.roster{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:min(96%,860px);}
.chip{background:rgba(255,255,255,.09); border:1.5px solid rgba(255,255,255,.16); border-radius:999px;
      padding:7px 15px; font-weight:700; font-size:.9rem; animation:popin .3s ease backwards;}
.chip.me{background:var(--teal); border-color:var(--teal); color:var(--ink);}
.chip.kickable{font-family:inherit; color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:7px;}
.chip.kickable .x{opacity:.35; font-size:.85em;}
.chip.kickable:hover{border-color:var(--wrong); color:var(--wrong);}
.chip.kickable:hover .x{opacity:1;}

/* ---------- star passport (My DM) ---------- */
.passgrid{display:flex; flex-direction:column; gap:14px; width:min(94%,420px);}
.pillcard{background:var(--cream); color:var(--ink); border-radius:4px; box-shadow:var(--paper-shadow);
          padding:14px 16px; text-align:left;}
.pillcard:nth-child(odd){transform:rotate(-.6deg);}
.pillcard:nth-child(even){transform:rotate(.6deg);}
.pillcard b{display:block; font-weight:800; font-size:.82rem; margin-bottom:9px;}
.starrow{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start;}
.starcol{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:1.55rem; line-height:1;}
.starcol.on{color:var(--blue);}
.starcol.off{color:rgba(34,49,60,.22);}
.starcol small{font-size:.56rem; font-weight:700; color:rgba(34,49,60,.55); white-space:nowrap;}
.lvlbadge{display:inline-block; font-weight:800; font-size:.95rem; color:var(--ink);
          background:var(--green); border-radius:999px; padding:7px 18px; box-shadow:var(--paper-shadow);}
.claimstar{font-size:4.2rem; line-height:1; color:var(--cream); animation:popin .4s ease backwards;}
/* host: claimed-star chips reuse .roster/.chip */
.sheet{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center;
       justify-content:center; z-index:20; padding:16px;}
.sheet form{background:var(--dark-2); border-radius:16px; padding:20px; width:min(100%,420px);
            display:flex; flex-direction:column; gap:10px; box-shadow:var(--paper-shadow);}
.sheet label{font-weight:800; font-size:.72rem; letter-spacing:.06em; color:var(--teal);
             text-transform:uppercase; margin-top:2px;}
.sheet select,.sheet input{border-radius:10px; border:1.5px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08); color:#fff; padding:11px 12px; font:inherit; font-weight:600; width:100%;}
.sheet select option{color:var(--ink);}
.sheet .row{display:flex; gap:10px; justify-content:flex-end; margin-top:8px;}
/* account block on the passport */
.acct{display:flex; flex-direction:column; gap:9px; width:min(94%,360px);}
.acct input{border-radius:12px; border:1.5px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08); color:#fff; padding:12px 14px; font:inherit; font-weight:600; width:100%;}
.acct input::placeholder{color:rgba(255,255,255,.55);}
.acct .row{display:flex; gap:9px; justify-content:center; flex-wrap:wrap;}
.acct .msg{font-size:.85rem; font-weight:700; color:var(--teal); margin:0; min-height:1.2em;}
.acct .msg.err{color:var(--wrong);}
/* Visible labels + real form semantics, so iOS/Android/1Password recognise the
   fields and offer a generated password on signup (Rafa review, 28.8.). */
.acct label{font-weight:800; font-size:.72rem; letter-spacing:.06em; color:var(--teal);
            text-transform:uppercase; text-align:left; display:block; margin-bottom:-4px;}
/* materials link under a star's topic in the passport */
.pillcard .matlink{display:inline-block; margin:8px 10px 0 0; font-weight:700; font-size:.8rem;
  color:var(--blue); text-decoration:none; border-bottom:1.5px solid rgba(67,92,198,.4);}
/* ---------- quiz review (My DM) ---------- */
.revlist{display:flex; flex-direction:column; gap:14px; width:min(94%,440px);}
.revcard{background:var(--cream); color:var(--ink); border-radius:4px; box-shadow:var(--paper-shadow);
         padding:14px 16px; text-align:left; font-size:.92rem; line-height:1.4;}
.revcard:nth-child(odd){transform:rotate(-.4deg);}
.revcard:nth-child(even){transform:rotate(.4deg);}
.revcard .rk{display:block; font-weight:800; font-size:.7rem; letter-spacing:.12em;
             text-transform:uppercase; color:var(--blue); margin-bottom:4px;}
.revcard .okmark{color:#5f8f2c;}
.revcard .badmark{color:var(--wrong);}
.revcard .rq{font-weight:800; margin:0 0 8px;}
.revcard .ra{margin:0 0 4px;}
.revcard .rw{margin:8px 0 0; padding-top:8px; border-top:1.5px dashed rgba(34,49,60,.25);}
.revcard .rw b{color:var(--blue); font-weight:800; font-size:.7rem; letter-spacing:.12em;
               text-transform:uppercase; display:block; margin-bottom:3px;}
.btn.danger{box-shadow:inset 0 0 0 2px var(--wrong); color:var(--wrong); background:transparent;}
/* fingerprint rescue banner */
.rescue{background:var(--cream); color:var(--ink); border-radius:var(--radius); padding:13px 16px;
        box-shadow:var(--paper-shadow); width:min(94%,380px); text-align:center;}
.rescue p{margin:0 0 10px; font-weight:700; font-size:.95rem;}
.rescue .row{display:flex; gap:9px; justify-content:center;}
/* the claimed star flies up off the claim screen, then pops into the passport */
@keyframes starfly{to{transform:translateY(-46vh) scale(.45); opacity:0;}}
.claimstar.fly{animation:starfly .6s cubic-bezier(.5,-.2,.8,.6) forwards;}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg);} 70%{transform:scale(1.35);} 100%{transform:scale(1);}}
.starcol.on.new{animation:starpop .7s cubic-bezier(.2,1.4,.4,1) both; animation-delay:.15s;}

/* ---------- host view (beamer) ---------- */
body.host{overflow:hidden;}
.hostwrap{height:100dvh; display:grid; grid-template-columns:minmax(0,42%) minmax(0,1fr);
          gap:clamp(24px,3.5vw,64px); padding:clamp(24px,3.2vw,56px); align-items:stretch;}
.hostwrap.solo{grid-template-columns:minmax(0,1fr);}
.hostleft{display:flex; flex-direction:column; justify-content:center; gap:clamp(10px,1.8vh,22px); min-width:0;}
.hostleft h1{font-size:clamp(1.9rem,3.4vw,3.4rem); line-height:1.04; margin:0;}
.hostleft .kicker{font-size:clamp(.85rem,1.2vw,1.15rem);}
.qrcard{background:#fff; border-radius:20px; padding:clamp(12px,1.4vw,20px); box-shadow:var(--paper-shadow);
        width:min(100%,52vh); align-self:flex-start;}
.qrcard svg{display:block; width:100%; height:auto;}
.scanlbl{font-weight:800; font-size:clamp(1rem,1.6vw,1.5rem); color:var(--green); margin:0;}
.joinurl{font-weight:600; font-size:clamp(.8rem,1.05vw,1.05rem); color:rgba(255,255,255,.55);
         overflow-wrap:anywhere; margin:0;}
.hostright{display:flex; flex-direction:column; gap:clamp(12px,2vh,24px); min-width:0; min-height:0;
           justify-content:center;}
.hoststats{display:flex; gap:clamp(24px,4vw,64px); flex:0 0 auto;}
.hoststats .metriclbl{font-size:clamp(.85rem,1.2vw,1.15rem); margin:0 0 2px;}
.hoststats .bignum{font-size:clamp(2.4rem,4.6vw,4rem);}
.hostboard{background:rgba(255,255,255,.06); border-radius:18px; padding:clamp(14px,1.6vw,26px);
           display:flex; flex-direction:column; min-height:0; flex:0 1 auto; overflow:hidden;}
.hrow{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:clamp(10px,1.4vw,24px);
      align-items:baseline; font-size:clamp(1rem,1.9vw,1.7rem); font-weight:600;
      padding:clamp(4px,.7vh,10px) 0; border-bottom:1px solid rgba(255,255,255,.07);}
.hrow:last-child{border-bottom:none;}
.hrow .rk{font-weight:800; color:var(--teal); min-width:1.5em;}
.hrow .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hrow .cr{font-size:.62em; color:rgba(255,255,255,.55); font-weight:600;}
.hrow .mv{font-size:.55em; font-weight:800; margin-left:.6em; vertical-align:middle;
          letter-spacing:.02em;}
.hrow .mv.up{color:var(--green);}
.hrow .mv.down{color:var(--wrong);}
.hrow .sc{font-weight:800; font-variant-numeric:tabular-nums;}
.hrow.top1{font-size:clamp(1.15rem,2.3vw,2.1rem);}
.hrow.top1 .rk,.hrow.top1 .sc,.hrow.top1 .nm{color:var(--green);}
.hostempty{color:rgba(255,255,255,.5); font-size:clamp(1rem,1.6vw,1.4rem); padding:10px 0;}
.hostfoot{position:fixed; bottom:12px; right:18px; font-size:.7rem; color:rgba(255,255,255,.25);}
.hostbar{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:12px;
         align-items:center; z-index:8;}
.hostq{height:100dvh; display:flex; flex-direction:column; gap:clamp(12px,2.2vh,28px);
       padding:clamp(20px,2.6vw,44px) clamp(24px,3.2vw,56px) clamp(70px,9vh,110px);}
.hostq .qtext{font-size:clamp(1.6rem,3.6vw,3.2rem); margin:0; text-wrap:balance; flex:0 0 auto;}
.hostq .grid{gap:clamp(12px,1.6vw,22px); margin:auto 0; flex:0 1 auto; min-height:0;}
.hostq .tile{min-height:clamp(70px,11vh,120px); font-size:clamp(1rem,1.9vw,1.7rem); cursor:default;}
.hostq .tile .badge{width:clamp(30px,2.6vw,46px); height:clamp(30px,2.6vw,46px);
                    font-size:clamp(.95rem,1.5vw,1.35rem); border-radius:9px;}
.hostq .timer{height:clamp(10px,1.4vh,18px);}
.hostq .dist{gap:clamp(8px,1.2vh,16px);}
.hostq .dbar{gap:clamp(10px,1.2vw,18px);}
.hostq .dbar .dl{width:clamp(28px,2.4vw,44px); height:clamp(28px,2.4vw,44px);
                 font-size:clamp(.9rem,1.4vw,1.3rem);}
.hostq .dbar .dt{height:clamp(42px,7vh,92px);}
.hostq .dbar .dlab{font-size:clamp(.95rem,1.7vw,1.55rem); padding:0 clamp(12px,1.2vw,20px);}
.hostq .dbar .dn{font-size:clamp(1.3rem,2.9vw,2.7rem); min-width:4ch;}
.hostq .dbar .dn small{font-size:.5em;}
.hostq .why{font-size:clamp(1rem,1.6vw,1.5rem); padding:clamp(12px,1.4vw,22px) clamp(14px,1.6vw,26px);}
.hostq .why b{font-size:clamp(.7rem,.9vw,.9rem);}
.hostq .qhead{display:flex; align-items:baseline; gap:clamp(12px,2vw,28px); flex:0 0 auto;}
.hostq .qhead .kicker{font-size:clamp(.9rem,1.3vw,1.3rem);}
.hostq .qhead .answered{margin-left:auto; font-weight:800; font-size:clamp(1rem,1.7vw,1.6rem);
                        color:var(--teal); white-space:nowrap;}
.hostq .split{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
              gap:clamp(16px,2.4vw,40px); flex:1; min-height:0;}
.hostq .split > div{display:flex; flex-direction:column; gap:clamp(10px,1.6vh,20px); min-height:0;
                     justify-content:center;}
.podium{display:flex; gap:clamp(12px,2vw,32px); align-items:flex-end; justify-content:center;
         flex:0 0 auto; margin-top:auto;}
.podium + .split{margin-bottom:auto;}
.pod{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0;}
.pod .pn{font-weight:800; font-size:clamp(1rem,1.9vw,1.8rem); max-width:7em; overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap;}
.pod .ps{font-weight:800; font-size:clamp(1.2rem,2.4vw,2.2rem); color:var(--ink);}
.pod .pb{border-radius:12px 12px 0 0; width:clamp(84px,11vw,190px); display:flex; align-items:flex-start;
         justify-content:center; padding-top:10px; background:rgba(255,255,255,.14);}
.pod.p1 .pb{background:var(--green); height:clamp(90px,15vh,180px);}
.pod.p2 .pb{background:var(--teal);  height:clamp(66px,11vh,132px);}
.pod.p3 .pb{background:var(--cream); height:clamp(50px,8vh,96px);}
.pod .pr{font-weight:800; font-size:clamp(.9rem,1.3vw,1.2rem); color:var(--teal);}
@media (max-aspect-ratio:1/1){
  .hostwrap{grid-template-columns:1fr; align-content:start; height:auto; min-height:100dvh; overflow:auto;}
  body.host{overflow:auto;}
  .qrcard{width:min(100%,360px); align-self:center;}
  .hostfoot{position:static; text-align:right; padding:8px 4px 0;}
  .hostq{height:auto; min-height:100dvh;}
  .hostq .split{grid-template-columns:1fr;}
}
.srcpill{font-weight:700; font-size:.72rem; color:rgba(255,255,255,.5);}
.err{background:rgba(255,255,255,.08); border-radius:12px; padding:14px 16px; max-width:46ch;
     font-size:.9rem; line-height:1.5; text-align:left;}
.err b{display:block; margin-bottom:5px;}
.waitdot::after{content:"…"; display:inline-block; animation:dots 1.4s steps(4,end) infinite; width:1.2em;
                text-align:left; overflow:hidden; vertical-align:bottom;}
@keyframes dots{0%{width:0} 100%{width:1.2em}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>

const LANGS = ["en","de","fr","it"];

/* The three curriculum pillars. Ids are forever — they sit in dm_stars rows. */

  civics:{ en:"Civics & Basic Concepts", de:"Staatskunde & Grundbegriffe", fr:"Civisme & concepts de base", it:"Educazione civica & concetti di base" },

};

const CHAMPION_PER_PILLAR = 3, MASTER_PER_PILLAR = 6;

/* ---------------- state ---------------- */

const SESSION = params.get("session") || "";
const HOST    = params.get("host") === "1";
const DEMO    = params.get("demo") === "1";
/* ?view=mydm öffnet den Sterne-Pass direkt, auch während eine Session läuft.
   Die Spezifikation sieht einen QR für drei Zustände vor — solange eine Runde
   aktiv ist, gewinnt aber das Spiel, und der Stern-QR auf der Schlussfolie
   landete deshalb im Spielfenster statt im Pass (Rafa, 04.09.2026). */
const VIEW    = params.get("view") || "";

let lang = store.get("lang", (()=>{
  const n=(navigator.language||"en").slice(0,2);
  return LANGS.includes(n) ? n : "en";
})());
if(!LANGS.includes(lang)) lang = "en";

let registry=null, pack=null, TIME=20000;
let phase="boot";              // boot | picker | error | join | lobby | question | reveal | done | solo*
let errKey="";
let LIVE=false;                // true once the host/player is talking to Supabase

let myToken = "", myName = store.get("name","");
let roster=[], answers=[], kicked=new Set(), liveState=null, lastKey="";
/* Stars are keyed by a stable per-device id, unlike the per-session quiz
   token (which regenerates on a name change). dm_token_links glues the two
   together, so a star awarded to either lands in the same passport. */
let DEVICE = store.get("device","");
if(!DEVICE){ DEVICE = newToken(); store.set("device", DEVICE); }
let sessionStars=[];           // host: claims for the current session
let passBack=null;             // where the passport's back button leads
let justClaimed=false;
let myAnswer=null;             // answer for the current question

/* solo-mode state */
let sQi=0, sScore=0, sStreak=0, sCorrect=0, sOrder=[], sPicked=-1, sTimedOut=false,
    sGain=0, sBonus=0;

let order=[];                  // shuffled option order, per question
const app = document.getElementById("app");

function t(){ return I18N[lang]; }
function L(o){ return (o && (o[lang] != null ? o[lang] : o.en)) || ""; }
function shuffled(n, rnd){
  const r = rnd || Math.random;
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* In live mode the beamer and every phone must label the same option "A",
   otherwise the host says "most of you picked B" and half the room is looking
   at a different B. A seeded shuffle gives every device the same order without
   anything having to be synced. Solo mode keeps the per-device shuffle. */
function hash32(str){
  let h = 2166136261>>>0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619)>>>0; }
  return h>>>0;
}
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a = (a + 0x6D2B79F5)>>>0;
    let t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}
function seededOrder(q, i, n){
  return shuffled(n, mulberry32(hash32(SESSION + "|" + (q.id || i) + "|" + n)));
}
function newToken(){
  try{ return crypto.randomUUID(); }
  catch(e){ return "xxxxxxxxxxxx4xxxyxxxxxxxxxxx".replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); }); }
}
function setLang(l){ lang=l; store.set("lang",l); document.documentElement.lang=l; rerender(); }
function cycleLang(){ setLang(LANGS[(LANGS.indexOf(lang)+1) % LANGS.length]); }

/* ---------------- server clock ----------------
   Every device counts down from the host's started_at, so the Date header
   is used to correct for phones whose clocks are off. */
let srvSkew = 0;
function noteDate(res){
  const d = res.headers.get("Date");
  if(d){ const p = Date.parse(d); if(!isNaN(p)) srvSkew = p - Date.now(); }
}
function serverNow(){ return Date.now() + srvSkew; }

/* ---------------- Supabase ---------------- */
function headers(extra){
  return Object.assign({ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY }, extra||{});
}
async function sbGet(pathAndQuery){
  if(!SUPA_URL || !SUPA_KEY) return null;
  try{
    const r = await fetch(SUPA_URL+"/rest/v1/"+pathAndQuery, { headers:headers(), cache:"no-store" });
    noteDate(r);
    if(!r.ok) return null;
    const j = await r.json();
    return Array.isArray(j) ? j : null;
  }catch(e){ return null; }
}
async function sbInsert(table, row, opts){
  if(!SUPA_URL || !SUPA_KEY) return false;
  try{
    const r = await fetch(SUPA_URL+"/rest/v1/"+table, {
      method:"POST",
      headers: headers({ "Content-Type":"application/json", Prefer:"return=minimal" }),
      body: JSON.stringify(row)
    });
    noteDate(r);
    // 409 = unique violation. For join and answer that means "already recorded",
    // which is exactly the guarantee we want, so treat it as success.
    if(r.status===409 && opts && opts.conflictOk) return true;
    return r.ok;
  }catch(e){ return false; }
}
const qsSession = () => "session=eq."+encodeURIComponent(SESSION);
const fetchState   = () => sbGet("dm_state?"+qsSession()+"&select=phase,q_index,round,started_at&order=started_at.desc&limit=1");
const fetchRoster  = () => sbGet("dm_players?"+qsSession()+"&round=eq."+curRound()
  +"&select=token,name&order=joined_at.asc&limit=200");
const fetchAnswers = () => sbGet("dm_answers?"+qsSession()+"&round=eq."+curRound()
  +"&select=token,name,q_index,choice,correct,points&limit=2000");
const fetchKicks   = () => sbGet("dm_kicks?"+qsSession()+"&select=token&limit=500");
const fetchSessionStars = () => sbGet("dm_stars?"+qsSession()+"&select=token,name&order=created_at.asc&limit=500");
/* Rounds exist because "New round" has to actually reset. Without one, a
   returning player's answer collides with their old row, their previous score
   stands, and the leaderboard sums every round together. */
function curRound(){ return (liveState && liveState.round) || 0; }

/* ---------------- boot ---------------- */
async function loadJSON(path){
  const r = await fetch(path, {cache:"no-cache"});
  if(!r.ok) throw new Error(path+" -> "+r.status);
  return r.json();
}
async function boot(){
  document.documentElement.lang = lang;
  authRefresh();                       // keep a stored login alive; fire and forget
  try{ registry = await loadJSON("packs/sessions.json"); }
  catch(e){ return fail("loadFail"); }

  if(DEMO && !HOST) return renderPassport();
  if(VIEW === "mydm" && !HOST) return renderPassport();

  if(!SESSION || !registry[SESSION]){
    if(SESSION) errKey = "noSessionSub";
    return renderPicker();
  }
  try{ pack = await loadJSON("packs/" + registry[SESSION].pack); }
  catch(e){ return fail("loadFail"); }

  TIME = pack.timer_ms || 20000;

  if(HOST){
    document.body.classList.add("host");
    order = pack.questions.map((q,i)=>seededOrder(q, i, L(q.o).length));
    const st = await fetchState();
    if(st===null) return fail("hostNeedsDb");
    LIVE = true;
    liveState = st[0] || null;
    /* A sitting is a thing you rejoin, not something a reload destroys.
       Reopening the beamer resumes whatever is running; only a session that
       has been idle long enough to be last time's starts fresh, so a monthly
       session never opens with the previous group still in the lobby. The
       host can force a clean slate at any time with "Clear players". */
    const idleMs = liveState
      ? serverNow() - Date.parse(liveState.started_at)
      : Infinity;
    if(!liveState || idleMs > SITTING_IDLE_MS){
      await pushState("lobby", -1, liveState ? (liveState.round||0)+1 : 0);
    }
    return startHostLoop();
  }

  myToken = store.get("token_"+SESSION, "");
  const st = await fetchState();
  LIVE = st !== null;
  if(LIVE) liveState = st[0] || null;
  order = LIVE
    ? pack.questions.map((q,i)=>seededOrder(q, i, L(q.o).length))
    : pack.questions.map(q=>shuffled(L(q.o).length));
  /* One QR, three modes: with no game running the phone rests on the
     passport; a 'stars' phase means the host has opened the claim window.
     The idle loop keeps watching, so the screen switches by itself the
     moment the host starts a lobby. */
  if(LIVE){
    const ph = liveState && liveState.phase;
    if(ph === "stars") return startIdleLoop("claim");
    if(!ph || ph === "done") return startIdleLoop("passport");
  }
  renderJoin();
}
function fail(key){ phase="error"; errKey=key; renderError(); }
function renderError(){
  const big = errKey==="hostNeedsDb";
  app.innerHTML = `<div class="screen">
    ${wordmarkHtml()}
    <h1>${esc(big ? t().hostNeedsDb : t().noSession)}</h1>
    <div class="err">${esc(big ? t().hostNeedsDbSub : t()[errKey] || "")}</div>
  </div>`;

/* The star screens are Curriculum, not Quiz — the passport outlives any
   single quiz session — and they drop the dP mark, which is DAY8's, not
   Democracy Matters'. */
function wordmarkHtml(cls, word){
  const logo = word ? "" : `<img class="wmlogo" src="${LOGO}" alt="">`;
  return `<div class="kicker ${cls||""}"><span class="wordmark">`
       + logo
       + `${esc(t().brand)} <span class="wm2">${esc(word||t().quiz)}</span></span></div>`;
}

/* ---------------- session picker ---------------- */
function renderPicker(){
  phase="picker";
  const ids = Object.keys(registry||{});
  app.innerHTML = `<div class="screen">
    ${langPills()}
    ${wordmarkHtml()}
    <h1>${esc(t().pickTitle)}</h1>
    <p class="sub">${esc(t().pickSub)}</p>
    ${errKey ? `<div class="err">${esc(t()[errKey])}</div>` : ""}
    <div class="picker">
      ${ids.map(id=>{
        const s = registry[id];
        const when = s.date
          ? new Date(s.date).toLocaleDateString(lang, {year:"numeric", month:"long", day:"numeric"})
          : "";
        return `<a href="?session=${encodeURIComponent(id)}">${esc(L(s.title)||id)}
          ${when ? `<small>${esc(when)}</small>` : ""}</a>`;
      }).join("") || `<p class="rules">—</p>`}
    </div>
    <button class="btn ghost small" id="mydm">${esc(t().myDM)} ★</button>
  </div>`;
  bindLangPills();
  document.getElementById("mydm").onclick = ()=>{ passBack=renderPicker; renderPassport(); };
}
function langPills(){
  return `<div class="pills" role="group" aria-label="Language">
    ${LANGS.map(l=>`<button class="pill ${l===lang?"on":""}" data-lang="${l}">${l.toUpperCase()}</button>`).join("")}
  </div>`;
}
function bindLangPills(){ app.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang)); }
function sessionTitle(){
  return L((registry[SESSION]||{}).title) || L(pack && pack.title) || SESSION;
}

/* ---------------- shared markup ---------------- */
function ctl(){
  return `<button class="iconbtn" id="sb" aria-pressed="${soundOn}" title="Sound">${soundOn?"🔊":"🔇"}</button>`;
}
function bindCtl(){ const sb=document.getElementById("sb"); if(sb) sb.onclick=()=>setSound(!soundOn); }
function setSound(v){
  soundOn=v; A.mute(!v); store.set("sound",v);
  if(v){ A.ensure(); A.unlock(); }
  document.querySelectorAll("#sb").forEach(b=>{ b.textContent=v?"🔊":"🔇"; b.setAttribute("aria-pressed",v); });
}
function topBar(right){
  return `<div class="top">
    <button class="langcycle" id="lc" title="${LANGS.map(l=>l.toUpperCase()).join(" / ")}">${lang.toUpperCase()}</button>
    ${ctl()}
    <span class="qcount">${esc(t().qof(curIndex()+1, pack.questions.length))}</span>
    <span class="scorechip">${right}</span>
  </div>`;
}
function bindTop(){ const lc=document.getElementById("lc"); if(lc) lc.onclick=cycleLang; bindCtl(); }
function curIndex(){ return LIVE ? (liveState ? liveState.q_index : 0) : sQi; }
function tilesHtml(q, od, opt){
  const opts = L(q.o);
  return `<div class="grid n${od.length}">
    ${od.map((oi,pos)=>{
      let cls="";
      if(opt.reveal) cls = oi===q.correct ? "win" : (oi===opt.picked ? "lose" : "dim");
      else if(oi===opt.picked) cls = "mine";
      return `<button class="tile ${cls}" data-oi="${oi}"${opt.reveal||opt.disabled?" disabled":""}>
        <span class="badge">${LETTERS[pos]}</span><span>${esc(opts[oi])}</span></button>`;
    }).join("")}
  </div>`;
}
function whyHtml(q){
  const why = L(q.explanation);
  return why ? `<div class="why"><b>${esc(t().why)}</b>${esc(why)}</div>` : "";
}
function timerHtml(){ return `<div class="timer" id="tw" aria-hidden="true"><i id="tbar"></i></div>`; }

/* ---------------- countdown ----------------
   In live mode the deadline comes from the host's started_at, so all
   devices drain the same bar. In solo mode it is local. */
function runTimer(onEnd){
  cancelAnimationFrame(rafId);
  const loop=()=>{
    const rem = deadline - (LIVE ? serverNow() : performance.now());
    const bar = document.getElementById("tbar"), wrap = document.getElementById("tw");
    if(bar) bar.style.width = Math.max(0, Math.min(100, rem/TIME*100))+"%";
    const sec = Math.ceil(rem/1000);
    if(wrap) wrap.classList.toggle("low", sec<=5);
    if(sec!==lastSec){ lastSec=sec; if(sec>=1 && sec<=5) A.tick(sec%2===0); }
    if(rem<=0){ if(onEnd) onEnd(); return; }
    rafId=requestAnimationFrame(loop);
  };
  rafId=requestAnimationFrame(loop);
}
function stopTimer(){ cancelAnimationFrame(rafId); rafId=0; }

/* ---------------- scoring ---------------- */
function pointsFor(remMs, streak){
  const base = 500 + Math.round(500*Math.max(0,Math.min(1, remMs/TIME)));
  const bonus = streak>=2 ? 50*Math.min(streak-1,4) : 0;
  return { base, bonus, total: base+bonus };
}

/* ---------------- answer log for the review view ----------------
   The phone remembers what it answered, so My DM can show the player's own
   answers next to the right ones during the video block. Local only, one
   log per session, reset when a new round (or solo run) starts. */
function recordReview(qi, choice){
  if(!SESSION) return;
  const r = store.get("review_"+SESSION, null) || { answers:{} };
  r.on = todayISO();
  r.answers[qi] = choice;
  store.set("review_"+SESSION, r);
}
function clearReview(){ if(SESSION) store.set("review_"+SESSION, null); }
function reviewData(){
  const r = SESSION ? store.get("review_"+SESSION, null) : null;
  return r && r.answers && Object.keys(r.answers).length ? r : null;
}

/* ---------------- aggregation ----------------
   PostgREST has no GROUP BY without a view, and a session is a few hundred
   rows at most, so the totals are computed here. */
function livePlayers(){ return roster.filter(p=>!kicked.has(p.token)); }
function leaderboard(){
  const by = new Map();
  for(const a of answers){
    if(kicked.has(a.token)) continue;
    const e = by.get(a.token) || { token:a.token, name:a.name, score:0, correct:0, total:0 };
    e.score += a.points; e.correct += a.correct?1:0; e.total += 1; e.name = a.name;
    by.set(a.token, e);
  }
  for(const p of livePlayers()) if(!by.has(p.token)) by.set(p.token, {token:p.token,name:p.name,score:0,correct:0,total:0});
  return [...by.values()].sort((a,b)=> b.score-a.score || a.name.localeCompare(b.name));
}
function answersFor(qi){ return answers.filter(a=>a.q_index===qi && !kicked.has(a.token)); }
/* Standings before this question, so the beamer can show who moved. With a
   full room the movement is the interesting part, not the raw totals. */
function ranksBefore(qi){
  const by = new Map();
  for(const a of answers){
    if(kicked.has(a.token) || a.q_index >= qi) continue;
    by.set(a.token, (by.get(a.token)||0) + a.points);
  }
  const order = [...by.entries()].sort((x,y)=>y[1]-x[1]).map(e=>e[0]);
  const m = new Map();
  order.forEach((tok,i)=>m.set(tok, i+1));
  return m;
}
function distributionFor(qi, q){
  const n = L(q.o).length, counts = new Array(n).fill(0);
  let none = 0;
  for(const a of answersFor(qi)){
    if(a.choice==null || a.choice<0 || a.choice>=n) none++; else counts[a.choice]++;
  }
  return { counts, none, total: answersFor(qi).length };
}
function myRank(){
  const lb = leaderboard();
  const i = lb.findIndex(r=>r.token===myToken);
  return { rank: i<0 ? null : i+1, of: lb.length, row: i<0 ? null : lb[i] };
}

/* The roster is per round, so a player sitting in the lobby when the host
   starts a new round has to register again — silently, on their behalf. */
async function rejoinRound(){
  if(!myToken) return;
  await sbInsert("dm_players",
    { session:SESSION, token:myToken, name:myName, round:curRound() }, { conflictOk:true });
}
async function joinLive(){
  // The token is the player's identity, so reloading mid-game keeps their score.
  // A different name means a different player though — otherwise the join would
  // 409 against the old row and silently keep the old name (and two people
  // sharing one device would collapse into one entry).
  const lastName = store.get("name_"+SESSION, "");
  if(!myToken || lastName !== myName){
    myToken = newToken();
    store.set("token_"+SESSION, myToken);
  }
  const ok = await sbInsert("dm_players",
    { session:SESSION, token:myToken, name:myName, round:curRound(), fp:canvasFp() },
    { conflictOk:true });
  if(!ok){ LIVE=false; return startSolo(); }   // database went away mid-join
  store.set("name_"+SESSION, myName);
  // glue the per-session quiz token to the stable device id, so a star
  // awarded to either shows up in the same passport (fire and forget)
  sbInsert("dm_token_links",
    { token_a:DEVICE, token_b:myToken, method:"device" }, { conflictOk:true });
  startPlayerLoop();
  checkRescue();
}

function startPlayerLoop(){
  clearInterval(pollId);
  tickPlayer();
  pollId = setInterval(tickPlayer, POLL_MS);
}
async function tickPlayer(){
  const st = await fetchState();
  if(st===null) return;                       // transient failure: keep the screen
  const next = st[0] || null;
  if(!next) return;
  liveState = next;
  const key = next.round + ":" + next.phase + ":" + next.q_index;
  const changed = key !== lastKey;
  if(changed){ lastKey = key; onPlayerPhase(next); }
  // the leaderboard and the distribution are only needed when they are on screen
  if(next.phase==="reveal" || next.phase==="done" || next.phase==="lobby"){
    const [r,a,k] = await Promise.all([fetchRoster(), fetchAnswers(), fetchKicks()]);
    if(r) roster=r; if(a) answers=a;
    if(k) kicked = new Set(k.map(x=>x.token));
    if(kicked.has(myToken)) return renderKicked();
    if(phase==="reveal") paintPlayerReveal();
    else if(phase==="done") renderPlayerDone();
    else if(phase==="lobby") paintLobbyCount();
  }
}
function onPlayerPhase(st){
  stopTimer();
  if(st.phase==="lobby"){ myAnswer=null; myStreak=0; answers=[]; clearReview(); rejoinRound(); renderPlayerLobby(); }
  else if(st.phase==="question"){ myAnswer=null; renderPlayerQuestion(); }
  else if(st.phase==="reveal"){ renderPlayerReveal(); }
  else if(st.phase==="done"){ renderPlayerDone(); }
  else if(st.phase==="stars"){ renderClaim(); }
}

function myTotal(){
  return answers.filter(a=>a.token===myToken).reduce((s,a)=>s+a.points,0);
}
async function submitAnswer(oi){
  if(phase!=="question" || myAnswer!==null) return;
  const qi = liveState.q_index, q = pack.questions[qi];
  const rem = Math.max(0, deadline - serverNow());
  // The countdown runs on requestAnimationFrame, which a backgrounded tab or a
  // locked phone stops delivering — so the on-screen timer is not authoritative.
  // The server clock is: past the deadline, a tap counts as no answer.
  if(rem <= 0) oi = null;
  const ok  = oi!==null && oi===q.correct;
  myStreak = ok ? myStreak+1 : 0;
  const pts = ok ? pointsFor(rem, myStreak) : {base:0,bonus:0,total:0};
  myAnswer = { choice:oi, correct:ok, points:pts.total, base:pts.base, bonus:pts.bonus };
  recordReview(qi, oi);
  stopTimer();
  if(oi===null) A.timeout(); else if(ok) A.correct(myStreak); else A.wrong();
  renderPlayerLocked();
  await sbInsert("dm_answers", {
    session:SESSION, token:myToken, name:myName, round:curRound(), q_index:qi,
    choice:oi, correct:ok, points:pts.total
  }, { conflictOk:true });
}

/* shared: distribution + leaderboard blocks */
function distHtml(qi, q, od, picked){
  const d = distributionFor(qi, q);
  const opts = L(q.o);
  const max = Math.max(1, ...d.counts);
  // Share of the room is what scales: "8 of 12" means little across sessions,
  // "67%" is comparable and reads from the back of the room.
  const votes = d.counts.reduce((a,b)=>a+b, 0);
  const pct = n => votes ? Math.round(n/votes*100) : 0;
  return `<div class="dist">
    ${od.map((oi,pos)=>{
      const n = d.counts[oi];
      const cls = (oi===q.correct ? " win" : "") + (oi===picked ? " mine" : "")
                + (n===0 ? " empty" : "") + (oi!==q.correct && n>0 ? " lose" : "");
      return `<div class="dbar${cls}">
        <span class="dl">${LETTERS[pos]}</span>
        <span class="dt"><span class="df" style="width:${Math.round(n/max*100)}%"></span>
          <span class="dlab">${esc(opts[oi])}</span></span>
        <span class="dn"><b>${pct(n)}%</b><small>${n}</small></span>
      </div>`;
    }).join("")}
  </div>`;
}
function boardHtml(limit){
  const lb = leaderboard().slice(0, limit);
  if(!lb.length) return "";
  return `<div class="board"><div class="boardtitle">${esc(t().board)} 🌍</div>
    ${lb.map((r,i)=>`<div class="brow${r.token===myToken?" me":""}${i===0?" lead":""}">
      <span class="bk">${i+1}</span>
      <span class="bn">${esc(r.name)}${r.token===myToken?` <small>(${esc(t().you)})</small>`:""}</span>
      <span class="bs">${r.score}</span></div>`).join("")}
  </div>`;
}

async function pushState(ph, qi, round){
  const rd = round==null ? curRound() : round;
  const ok = await sbInsert("dm_state", { session:SESSION, phase:ph, q_index:qi, round:rd });
  if(ok){ liveState = { phase:ph, q_index:qi, round:rd,
                        started_at:new Date(serverNow()).toISOString() }; }
  return ok;
}
function startHostLoop(){
  clearInterval(pollId);
  tickHost();
  pollId = setInterval(tickHost, POLL_MS);
}
async function tickHost(){
  const [st, r, a, k] = await Promise.all([fetchState(), fetchRoster(), fetchAnswers(), fetchKicks()]);
  if(r) roster=r;
  if(a) answers=a;
  if(k) kicked = new Set(k.map(x=>x.token));
  if(st && st[0]) liveState = st[0];
  if(!liveState) return;
  if(liveState.phase==="stars"){
    const s = await fetchSessionStars();
    if(s) sessionStars = s;
  }
  if(phase==="question" && deadline && serverNow() > deadline){ goReveal(); return; }
  const key = liveState.round + ":" + liveState.phase + ":" + liveState.q_index;
  if(key !== lastKey){ lastKey = key; renderHost(); }
  else paintHost();
}
function renderHost(){
  stopTimer();
  const p = liveState.phase;
  if(p==="question") renderHostQuestion();
  else if(p==="reveal") renderHostReveal();
  else if(p==="done") renderHostDone();
  else if(p==="stars") renderHostStars();
  else renderHostLobby();
}
function paintHost(){
  if(phase==="lobby") paintHostLobby();
  else if(phase==="question") paintHostAnswered();
  else if(phase==="hoststars") paintHostStars();
  else if(phase==="reveal" || phase==="done") renderHost();
}
function joinUrl(){
  return location.origin + location.pathname + "?session=" + encodeURIComponent(SESSION);
}
function qrSvg(text){
  try{
    const qr = qrcode(0,"M");
    qr.addData(text); qr.make();
    // margin is in modules: the QR spec wants a 4-module quiet zone, and the
    // white card's padding is nowhere near that at beamer size.
    return qr.createSvgTag({ cellSize:8, margin:4, scalable:true });
  }catch(e){ return `<p class="joinurl">${esc(text)}</p>`; }
}

function hostBoardHtml(limit, qi){
  const lb = leaderboard().slice(0, limit);
  const before = qi==null ? null : ranksBefore(qi);
  const move = tok => {
    if(!before || !before.has(tok)) return "";
    const was = before.get(tok), now = lb.findIndex(r=>r.token===tok)+1;
    if(now===0 || was===now) return "";
    const up = now < was;
    return `<span class="mv ${up?"up":"down"}">${up?"\u25b2":"\u25bc"}${Math.abs(was-now)}</span>`;
  };
  return `<div class="hostboard">
    <div class="boardtitle">${esc(t().board)}</div>
    ${lb.length ? lb.map((r,i)=>`<div class="hrow${i===0?" top1":""}">
        <span class="rk">${i+1}</span>
        <span class="nm">${esc(r.name)}${move(r.token)}</span>
        <span class="cr">${r.correct}/${r.total}</span>
        <span class="sc">${r.score}</span>
      </div>`).join("")
    : `<div class="hostempty">${esc(t().noScores)}</div>`}
  </div>`;
}

/* ================================================================
   SOLO — the fallback when there is no database
   ================================================================ */
function startSolo(){
  sQi=0; sScore=0; sStreak=0; sCorrect=0;
  clearReview();
  sOrder = pack.questions.map(q=>shuffled(L(q.o).length));   // solo: fresh each round
  order = sOrder;
  if(soundOn) A.music();
  soloBegin();
}
function soloBegin(){
  sPicked=-1; sTimedOut=false; sGain=0; sBonus=0; lastSec=99;
  deadline = performance.now() + TIME;
  renderSoloQuestion();
  runTimer(()=>{ if(phase==="question"){ sTimedOut=true; sPicked=-1; sStreak=0;
    recordReview(sQi, null); A.timeout(); renderSoloReveal(); } });
}
function renderSoloQuestion(){
  phase="question";
  const q = pack.questions[sQi], od = sOrder[sQi];
  app.innerHTML = `${topBar(String(sScore))}
  <div class="stage">
    ${timerHtml()}
    ${q.img ? `<div class="qimg"><img src="${esc(q.img)}" alt=""></div>` : ""}
    <div class="qtext">${esc(L(q.q))}</div>
    ${tilesHtml(q, od, {picked:-1})}
  </div>`;
  bindTop();
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>soloPick(+b.dataset.oi));
}
function soloPick(oi){
  if(phase!=="question") return;
  const rem = Math.max(0, deadline - performance.now());
  sPicked = oi;
  const q = pack.questions[sQi];
  recordReview(sQi, oi);
  if(oi===q.correct){
    sStreak++; sCorrect++;
    const p = pointsFor(rem, sStreak);
    sGain=p.base; sBonus=p.bonus; sScore+=p.total;
    A.correct(sStreak);
  } else { sStreak=0; sGain=0; sBonus=0; A.wrong(); }
  stopTimer();
  renderSoloReveal();
}
function renderSoloReveal(){
  phase="reveal";
  stopTimer();
  const q = pack.questions[sQi], od = sOrder[sQi];
  const ok = sPicked===q.correct;
  const banner = ok
    ? `<div class="banner good">${esc(t().correct)} <span class="pts">+${sGain+sBonus}</span>
        ${sBonus?`<small>${esc(t().streak(sStreak))} · +${sBonus}</small>`:""}</div>`
    : `<div class="banner bad">${esc(sTimedOut?t().timeout:t().wrong)}
        <small>${esc(t().answerWas)} ${esc(L(q.o)[q.correct])}</small></div>`;
  app.innerHTML = `${topBar(String(sScore))}
  <div class="stage rev">
    ${banner}
    <div class="qtext">${esc(L(q.q))}</div>
    ${tilesHtml(q, od, {picked:sPicked, reveal:true})}
    ${whyHtml(q)}
    <div class="nextrow"><button class="btn" id="next">${
      esc(sQi < pack.questions.length-1 ? t().next : t().last)}</button></div>
  </div>`;
  bindTop();
  const n = document.getElementById("next");
  n.onclick = ()=>{ A.tap(); if(sQi<pack.questions.length-1){ sQi++; soloBegin(); } else renderSoloDone(); };
  n.focus({preventScroll:true});
}
function renderSoloDone(){
  phase="done";
  stopTimer();
  if(!renderSoloDone.fx){ renderSoloDone.fx=true; A.fanfare(); }
  const best = store.get("best_"+SESSION, 0);
  if(sScore > best) store.set("best_"+SESSION, sScore);
  app.innerHTML = `<div class="corner">${ctl()}</div>
  <div class="screen">
    ${langPills()}
    <p class="metriclbl">${esc(t().result)}</p>
    <p class="bignum">${sScore}</p>
    <p class="sub">${esc(t().ofN(sCorrect, pack.questions.length))}</p>
    <p class="brandline">📱 ${esc(t().soloTitle)}</p>
    <button class="btn ghost" id="again">${esc(t().again)}</button>
    <button class="btn ghost small" id="mydm">${esc(t().myDM)} ★</button>
    ${wordmarkHtml()}
  </div>`;
  bindLangPills(); bindCtl();
  document.getElementById("again").onclick = ()=>{ renderSoloDone.fx=false; startSolo(); };
  document.getElementById("mydm").onclick = ()=>{ passBack=renderSoloDone; renderPassport(); };
}

function fmtDate(isoStr){
  const m = String(isoStr||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${+m[3]}.${+m[2]}.${m[1].slice(2)}` : "";
}
function todayISO(){
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function localStars(){ return store.get("stars", []); }
function pillarOf(){ return (registry && registry[SESSION] || {}).pillar || ""; }

/* ---------------- idle loop ----------------
   Runs while the phone rests on the passport or the claim screen, so the
   view follows the host: lobby opens -> join screen, claim window opens ->
   claim screen. */
let idleKey="";
function startIdleLoop(mode){
  clearInterval(pollId);
  idleKey = liveState ? liveState.round+":"+liveState.phase+":"+liveState.q_index : "";
  if(mode==="claim") renderClaim(); else renderPassport();
  pollId = setInterval(tickIdle, POLL_MS*2);
}
async function tickIdle(){
  const st = await fetchState();
  if(st===null || !st[0]) return;
  liveState = st[0];
  const key = liveState.round+":"+liveState.phase+":"+liveState.q_index;
  if(key === idleKey) return;
  idleKey = key;
  const ph = liveState.phase;
  if(ph==="lobby" || ph==="question" || ph==="reveal"){
    clearInterval(pollId); pollId=0;
    renderJoin();
  } else if(ph==="stars"){
    if(phase!=="claim") renderClaim();
  } else if(ph==="done"){
    if(phase!=="passport") renderPassport();
  }
}
