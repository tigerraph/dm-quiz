:root{
  /* DM / DAY8 tokens — verified against DM_Format_Learning-Loop deck */
  --blue:#435CC6; --green:#A8D272; --teal:#5EB9A9;
  --cream:#FDF2D0; --dark:#1B2329; --ink:#22313C;
  --blue-deep:#33489e; --dark-2:#232c33;
  --paper-shadow:0 6px 18px rgba(0,0,0,.32);
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  min-height:100dvh; background:var(--dark); color:#fff;
  font-family:'Poppins','Segoe UI',system-ui,sans-serif; font-weight:400;
  -webkit-font-smoothing:antialiased;
}
h1,h2,.xb{font-weight:800; letter-spacing:-.01em;}
#app{max-width:660px; margin:0 auto; padding:14px 16px calc(22px + env(safe-area-inset-bottom));
     min-height:100dvh; display:flex; flex-direction:column;}
body.host #app{max-width:none; padding:0;}

/* ---------- shared ---------- */
.kicker{font-weight:800; font-size:.82rem; letter-spacing:.02em; color:var(--teal);}
.btn{
  display:inline-block; border:none; cursor:pointer; text-decoration:none;
  font-family:inherit; font-weight:800; font-size:1.02rem;
  color:#fff; background:var(--blue); padding:14px 30px; border-radius:999px;
  box-shadow:0 4px 0 var(--blue-deep); transition:transform .12s ease;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--blue-deep);}
.btn.small{padding:11px 18px; font-size:.9rem; border-radius:12px; box-shadow:0 3px 0 var(--blue-deep);}
.btn.ghost{background:transparent; color:#fff; box-shadow:inset 0 0 0 2px var(--teal);}
.btn.ghost:active{transform:translateY(3px); box-shadow:inset 0 0 0 2px var(--teal);}
.btn:disabled{opacity:.55; cursor:default;}
.btn:focus-visible,.tile:focus-visible,.pill:focus-visible,
.namewrap input:focus-visible,.picker a:focus-visible{outline:3px solid var(--teal); outline-offset:3px;}
.namewrap input:focus{outline:3px solid var(--teal); outline-offset:2px; border-color:transparent;}
.pills{display:flex; gap:8px; justify-content:center;}
.pill{
  font-family:inherit; font-weight:800; font-size:.8rem; letter-spacing:.06em;
  color:rgba(255,255,255,.75); background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.28); border-radius:999px; padding:6px 15px; cursor:pointer;
}
.pill.on{color:var(--ink); background:var(--teal); border-color:var(--teal);}
.iconbtn{width:36px; height:36px; border-radius:11px; border:1.5px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08); color:#fff; font-size:1rem; cursor:pointer; line-height:1; padding:0;}
.corner{position:fixed; top:calc(10px + env(safe-area-inset-top)); right:14px; display:flex; gap:8px; z-index:6;}

/* post-it surface — the deck's signature card */
.postit{background:var(--cream); color:var(--ink); border-radius:4px; box-shadow:var(--paper-shadow);}

/* ---------- centred screens ---------- */
.screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
        text-align:center; gap:16px; padding:20px 0;}
.screen h1{font-size:clamp(1.9rem,8.5vw,3rem); line-height:1.04; margin:0;}
.sub{color:rgba(255,255,255,.82); font-size:1rem; max-width:40ch; margin:0;}
.rules{color:rgba(255,255,255,.62); font-size:.84rem; max-width:42ch; margin:0;}
.brandline{font-weight:800; font-size:.8rem; letter-spacing:.04em; color:rgba(255,255,255,.6);}
.namewrap{display:flex; gap:8px; width:min(94%,360px);}
.namewrap input{
  flex:1; min-width:0; border-radius:12px; border:1.5px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08); color:#fff; padding:13px 15px; font:inherit; font-weight:600;
}
.namewrap input::placeholder{color:rgba(255,255,255,.55);}
.picker{display:flex; flex-direction:column; gap:10px; width:min(94%,400px);}
.picker a{
  display:block; text-decoration:none; text-align:left; padding:14px 16px; border-radius:var(--radius);
  background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.16); color:#fff; font-weight:700;
}
.picker a small{display:block; font-weight:600; font-size:.78rem; color:rgba(255,255,255,.55); margin-top:2px;}

/* ---------- top bar ---------- */
.top{display:flex; align-items:center; gap:10px; padding:2px 0 12px;}
.top .qcount{color:rgba(255,255,255,.7); font-size:.85rem; font-weight:700; margin-left:auto; white-space:nowrap;}
.scorechip{background:rgba(255,255,255,.1); border-radius:999px; padding:5px 12px;
  font-weight:800; font-size:.85rem; white-space:nowrap;}
.langcycle{border:1.5px solid rgba(255,255,255,.28); background:transparent; color:rgba(255,255,255,.8);
  font-family:inherit; font-weight:800; font-size:.72rem; border-radius:9px; padding:6px 9px;
  cursor:pointer; letter-spacing:.06em;}

/* ---------- question ---------- */
.stage{flex:1; display:flex; flex-direction:column; gap:14px;}
.timer{height:9px; border-radius:999px; background:rgba(255,255,255,.14); overflow:hidden;}
.timer i{display:block; height:100%; width:100%; background:var(--teal); border-radius:999px;}
.qimg{display:flex; justify-content:center;}
.qimg img{max-height:min(30dvh,320px); max-width:100%; border-radius:10px;}
.qtext{font-weight:800; font-size:clamp(1.15rem,5.2vw,1.6rem); line-height:1.2;
       text-align:center; margin:auto 2px; text-wrap:balance;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:auto;}
.grid.n2{grid-template-columns:1fr 1fr;}
.grid.n3 .tile:last-child{grid-column:1/-1;}
.tile{
  position:relative; border:none; cursor:pointer; text-align:left;
  display:flex; align-items:center; gap:11px; min-height:74px; padding:14px 14px;
  background:var(--cream); color:var(--ink); border-radius:4px; box-shadow:var(--paper-shadow);
  font-family:inherit; font-weight:600; font-size:clamp(.92rem,3.6vw,1.05rem); line-height:1.25;
  transition:transform .12s ease, opacity .25s ease, filter .25s ease;
}
.tile:nth-child(odd){transform:rotate(-.9deg);}
.tile:nth-child(even){transform:rotate(.9deg);}
.tile:active{transform:translateY(2px);}
.tile .badge{
  flex:0 0 auto; width:28px; height:28px; border-radius:7px; background:var(--blue); color:#fff;
  font-weight:800; font-size:.92rem; display:flex; align-items:center; justify-content:center;
}
.tile.dim{opacity:.3; filter:saturate(.35);}
.tile.win{background:var(--green); box-shadow:0 0 0 3px #fff, var(--paper-shadow);}
.tile.win .badge{background:var(--ink);}
.tile.win::after{content:"\2713"; position:absolute; top:7px; right:11px; font-weight:800; font-size:1.05rem;}
.tile.lose::after{content:"\2715"; position:absolute; top:7px; right:11px; font-weight:800; font-size:1.05rem;}
@keyframes popin{from{transform:translateY(10px) scale(.96); opacity:0;} to{opacity:1;}}

/* ---------- reveal ---------- */
.banner{text-align:center; border-radius:var(--radius); padding:11px 15px; font-weight:800; font-size:1.02rem;}
.banner.good{background:rgba(168,210,114,.22); box-shadow:inset 0 0 0 1.5px var(--green); color:var(--green);}
.banner.bad{background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);}
.banner small{display:block; font-size:.82rem; font-weight:600; color:rgba(255,255,255,.75); margin-top:3px;}
.banner .pts{color:#fff; font-size:1.2rem;}
/* the Learning Loop "Check" beat */
.why{background:var(--cream); color:var(--ink); border-radius:var(--radius); padding:13px 16px;
     font-size:.94rem; line-height:1.45; text-align:left; box-shadow:var(--paper-shadow);}
.why b{display:block; font-weight:800; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
       color:var(--blue); margin-bottom:4px;}
.nextrow{display:flex; justify-content:center; margin-top:auto; padding-top:4px;}
.stage.rev{gap:12px;}
.stage.rev .qtext{margin:0 2px; font-size:1rem; font-weight:600; opacity:.85;}
.stage.rev .grid{margin-top:0;}

/* ---------- end ---------- */
.bignum{font-weight:800; font-size:clamp(3rem,15vw,4.4rem); line-height:1; margin:0;}
.metriclbl{font-weight:800; font-size:.8rem; color:var(--teal); margin:0;}
.board{width:min(94%,400px); background:rgba(255,255,255,.06); border-radius:12px; padding:12px 15px; font-size:.9rem;}
.boardtitle{font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:.66rem;
            color:var(--teal); margin-bottom:7px;}
.brow{display:flex; justify-content:space-between; gap:12px; line-height:1.85;}
.brow.me{color:var(--green); font-weight:800;}
.brow span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- host view (beamer) ---------- */
body.host{overflow:hidden;}
.hostwrap{height:100dvh; display:grid; grid-template-columns:minmax(0,42%) minmax(0,1fr);
          gap:clamp(24px,3.5vw,64px); padding:clamp(24px,3.2vw,56px); align-items:stretch;}
.hostleft{display:flex; flex-direction:column; justify-content:center; gap:clamp(10px,1.8vh,22px); min-width:0;}
.hostleft h1{font-size:clamp(1.9rem,3.4vw,3.4rem); line-height:1.04; margin:0;}
.hostleft .kicker{font-size:clamp(.85rem,1.2vw,1.15rem);}
.qrcard{background:#fff; border-radius:20px; padding:clamp(12px,1.4vw,20px); box-shadow:var(--paper-shadow);
        width:min(100%,52vh); align-self:flex-start;}
.qrcard svg{display:block; width:100%; height:auto;}
.scanlbl{font-weight:800; font-size:clamp(1rem,1.6vw,1.5rem); color:var(--green); margin:0;}
.joinurl{font-weight:600; font-size:clamp(.8rem,1.05vw,1.05rem); color:rgba(255,255,255,.55);
         overflow-wrap:anywhere; margin:0;}
.hostright{display:flex; flex-direction:column; gap:clamp(12px,2vh,24px); min-width:0; min-height:0;
           justify-content:center;}
.hoststats{display:flex; gap:clamp(24px,4vw,64px); flex:0 0 auto;}
.hoststats .metriclbl{font-size:clamp(.85rem,1.2vw,1.15rem); margin:0 0 2px;}
.hoststats .bignum{font-size:clamp(2.4rem,4.6vw,4rem);}
.hostboard{background:rgba(255,255,255,.06); border-radius:18px; padding:clamp(14px,1.6vw,26px);
           display:flex; flex-direction:column; min-height:0; flex:0 1 auto; overflow:hidden;}
.hrow{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:clamp(10px,1.4vw,24px);
      align-items:baseline; font-size:clamp(1rem,1.9vw,1.7rem); font-weight:600;
      padding:clamp(4px,.7vh,10px) 0; border-bottom:1px solid rgba(255,255,255,.07);}
.hrow:last-child{border-bottom:none;}
.hrow .rk{font-weight:800; color:var(--teal); min-width:1.5em;}
.hrow .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hrow .cr{font-size:.62em; color:rgba(255,255,255,.55); font-weight:600;}
.hrow .sc{font-weight:800; font-variant-numeric:tabular-nums;}
.hrow.top1{font-size:clamp(1.15rem,2.3vw,2.1rem);}
.hrow.top1 .rk,.hrow.top1 .sc,.hrow.top1 .nm{color:var(--green);}
.hostempty{color:rgba(255,255,255,.5); font-size:clamp(1rem,1.6vw,1.4rem); padding:10px 0;}
.hostfoot{position:fixed; bottom:12px; right:18px; font-size:.7rem; color:rgba(255,255,255,.25);}
@media (max-aspect-ratio:1/1){
  .hostwrap{grid-template-columns:1fr; align-content:start; height:auto; min-height:100dvh; overflow:auto;}
  body.host{overflow:auto;}
  .qrcard{width:min(100%,360px); align-self:center;}
}
.srcpill{font-weight:700; font-size:.72rem; color:rgba(255,255,255,.5);}
.err{background:rgba(255,255,255,.08); border-radius:12px; padding:14px 16px; max-width:42ch;
     font-size:.9rem; line-height:1.5;}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>

<div id="app" role="main">
  <div class="screen"><p class="sub">Loading …</p></div>
</div>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

};
const LANGS = ["en","de"];

/* ---------------- state ---------------- */
const params  = new URLSearchParams(location.search);
const SESSION = params.get("session") || "";
const HOST    = params.get("host") === "1";

let lang  = store.get("lang", (navigator.language||"en").slice(0,2)==="de" ? "de" : "en");
if(!LANGS.includes(lang)) lang = "en";

let registry = null, pack = null, TIME = 20000;
let phase = "boot";                  // boot | picker | join | question | reveal | end | host | error
let qi=0, score=0, streak=0, correctCount=0, order=[];
let deadline=0, rafId=0, picked=-1, lastGain=0, lastBonus=0, timedOut=false, lastSec=99;
let playerName = store.get("name","");
let cloudRows = null, myRow = null, saveState = "idle";
let soundOn = store.get("sound", true);
let errKey = "";          // i18n key, resolved at render so it follows the language switch

const app = document.getElementById("app");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function t(){ return I18N[lang]; }
function L(o){ return (o && (o[lang] != null ? o[lang] : o.en)) || ""; }
function shuffled(n){
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function setLang(l){
  lang = l; store.set("lang", l);
  document.documentElement.lang = l;
  rerender();
}
function cycleLang(){ setLang(lang==="en" ? "de" : "en"); }
function rerender(){
  if(phase==="picker") renderPicker();
  else if(phase==="join") renderJoin();
  else if(phase==="question") renderQuestion();
  else if(phase==="reveal") renderReveal();
  else if(phase==="end") renderEnd();
  else if(phase==="host") renderHost();
  else if(phase==="error") renderError();
}

/* ---------------- boot ---------------- */
async function loadJSON(path){
  const r = await fetch(path, {cache:"no-cache"});
  if(!r.ok) throw new Error(path+" -> "+r.status);
  return r.json();
}
async function boot(){
  document.documentElement.lang = lang;
  try{ registry = await loadJSON("packs/sessions.json"); }
  catch(e){ return fail("loadFail"); }

  if(!SESSION || !registry[SESSION]){
    if(SESSION) errKey = "noSessionSub";
    return renderPicker();
  }
  try{ pack = await loadJSON("packs/" + registry[SESSION].pack); }
  catch(e){ return fail("loadFail"); }

  TIME = pack.timer_ms || 20000;
  order = pack.questions.map(q => shuffled(L(q.o).length));

  if(HOST){ document.body.classList.add("host"); return startHost(); }
  renderJoin();
}
function fail(key){ phase="error"; errKey=key; renderError(); }
function renderError(){
  app.innerHTML = `<div class="screen">
    <div class="kicker">${esc(t().brand)}</div>
    <h1>${esc(t().noSession)}</h1>
    <div class="err">${esc(t()[errKey] || "")}</div>
  </div>`;
}

/* ---------------- session picker ---------------- */
function renderPicker(){
  phase="picker";
  const ids = Object.keys(registry||{});
  app.innerHTML = `<div class="screen">
    ${langPills()}
    <div class="kicker">${esc(t().brand)}</div>
    <h1>${esc(t().pickTitle)}</h1>
    <p class="sub">${esc(t().pickSub)}</p>
    ${errKey ? `<div class="err">${esc(t()[errKey])}</div>` : ""}
    <div class="picker">
      ${ids.map(id=>{
        const s = registry[id];
        return `<a href="?session=${encodeURIComponent(id)}">${esc(L(s.title)||id)}
          <small>${esc(s.date || id)}</small></a>`;
      }).join("") || `<p class="rules">—</p>`}
    </div>
  </div>`;
  bindLangPills();
}
function langPills(){
  return `<div class="pills" role="group" aria-label="Language">
    ${LANGS.map(l=>`<button class="pill ${l===lang?"on":""}" data-lang="${l}">${l.toUpperCase()}</button>`).join("")}
  </div>`;
}
function bindLangPills(){
  app.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
}

/* ---------------- join ---------------- */
function renderJoin(){
  phase="join";
  app.innerHTML = `<div class="corner">${ctl()}</div>
  <div class="screen">
    ${langPills()}
    <div class="kicker">${esc(t().brand)} &middot; ${esc(t().quiz)}</div>
    <h1>${esc(L(pack.title) || L(registry[SESSION].title))}</h1>
    <p class="sub">${esc(t().joinSub)}</p>
    <div class="namewrap">
      <input id="pname" maxlength="14" placeholder="${esc(t().namePh)}" value="${esc(playerName)}"
             autocomplete="nickname" enterkeyhint="go">
    </div>
    <button class="btn" id="go">${esc(t().play)}</button>
    <p class="rules">${esc(t().meta(pack.questions.length, Math.round(TIME/1000)))}</p>
  </div>`;
  bindLangPills(); bindCtl();
  const inp = document.getElementById("pname");
  const go  = ()=>{
    playerName = (inp.value||"").trim().slice(0,14) || "???";
    store.set("name", playerName);
    startGame();
  };
  document.getElementById("go").onclick = go;
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
}

/* ---------------- game ---------------- */
function startGame(){
  qi=0; score=0; streak=0; correctCount=0; saveState="idle"; myRow=null;
  A.ensure(); A.unlock(); if(soundOn) A.music();
  beginQuestion();
}
function beginQuestion(){
  picked=-1; timedOut=false; lastGain=0; lastBonus=0; lastSec=99;
  deadline = performance.now() + TIME;
  renderQuestion(); tick();
}
function topBar(){
  return `<div class="top">
    <button class="langcycle" id="lc" title="EN / DE">${lang.toUpperCase()}</button>
    ${ctl()}
    <span class="qcount">${esc(t().qof(qi+1, pack.questions.length))}</span>
    <span class="scorechip">${score}</span>
  </div>`;
}
function curQ(){ return pack.questions[qi]; }
function renderQuestion(){
  phase="question";
  const q=curQ(), opts=L(q.o), od=order[qi];
  app.innerHTML = `${topBar()}
  <div class="stage">
    ${q.img ? `<div class="qimg"><img src="${esc(q.img)}" alt=""></div>` : ""}
    <div class="timer" aria-hidden="true"><i id="tbar"></i></div>
    <div class="qtext">${esc(L(q.q))}</div>
    <div class="grid n${od.length}" id="grid">
      ${od.map((oi,pos)=>`<button class="tile" data-oi="${oi}">
        <span class="badge">${LETTERS[pos]}</span><span>${esc(opts[oi])}</span></button>`).join("")}
    </div>
  </div>`;
  document.getElementById("lc").onclick = cycleLang;
  bindCtl();
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>pick(+b.dataset.oi));
}
function tick(){
  cancelAnimationFrame(rafId);
  const loop=()=>{
    const rem = deadline - performance.now();
    const bar = document.getElementById("tbar");
    if(bar) bar.style.width = Math.max(0, rem/TIME*100)+"%";
    const sec = Math.ceil(rem/1000);
    if(sec!==lastSec){ lastSec=sec; if(sec>=1 && sec<=5) A.tick(sec%2===0); }
    if(rem<=0){ onTimeout(); return; }
    if(phase==="question") rafId=requestAnimationFrame(loop);
  };
  rafId=requestAnimationFrame(loop);
}
function pick(oi){
  if(phase!=="question") return;
  const rem = Math.max(0, deadline - performance.now());
  picked = oi;
  if(oi === curQ().correct){
    streak++; correctCount++;
    lastGain  = 500 + Math.round(500*rem/TIME);
    lastBonus = streak>=2 ? 50*Math.min(streak-1,4) : 0;
    score += lastGain + lastBonus;
    A.correct(streak);
  } else { streak=0; A.wrong(); }
  renderReveal();
}
function onTimeout(){
  if(phase!=="question") return;
  timedOut=true; picked=-1; streak=0; A.timeout(); renderReveal();
}
function renderReveal(){
  phase="reveal";
  cancelAnimationFrame(rafId);
  const q=curQ(), opts=L(q.o), od=order[qi];
  const ok = picked===q.correct;
  const banner = ok
    ? `<div class="banner good">${esc(t().correct)} <span class="pts">+${lastGain+lastBonus}</span>
        ${lastBonus?`<small>${esc(t().streak(streak))} &middot; +${lastBonus}</small>`:""}</div>`
    : `<div class="banner bad">${esc(timedOut?t().timeout:t().wrong)}
        <small>${esc(t().answerWas)} ${esc(opts[q.correct])}</small></div>`;
  const why = L(q.explanation);
  app.innerHTML = `${topBar()}
  <div class="stage rev">
    ${banner}
    <div class="qtext">${esc(L(q.q))}</div>
    <div class="grid n${od.length}">
      ${od.map((oi,pos)=>{
        const cls = oi===q.correct ? "win" : (oi===picked ? "lose" : "dim");
        return `<button class="tile ${cls}" disabled>
          <span class="badge">${LETTERS[pos]}</span><span>${esc(opts[oi])}</span></button>`;
      }).join("")}
    </div>
    ${why ? `<div class="why"><b>${esc(t().why)}</b>${esc(why)}</div>` : ""}
    <div class="nextrow"><button class="btn" id="next">${
      esc(qi < pack.questions.length-1 ? t().next : t().last)}</button></div>
  </div>`;
  document.getElementById("lc").onclick = cycleLang;
  bindCtl();
  const n = document.getElementById("next");
  n.onclick = ()=>{ A.tap(); advance(); };
  n.focus({preventScroll:true});
}
function advance(){
  if(qi < pack.questions.length-1){ qi++; beginQuestion(); }
  else { submitScore(); renderEnd(); }
}

/* ---------------- end ---------------- */
function renderEnd(){
  phase="end";
  if(!renderEnd.fx){ renderEnd.fx=true; A.fanfare(); }
  app.innerHTML = `<div class="corner">${ctl()}</div>
  <div class="screen">
    ${langPills()}
    <p class="metriclbl">${esc(t().result)}</p>
    <p class="bignum">${score}</p>
    <p class="sub">${esc(t().ofN(correctCount, pack.questions.length))}</p>
    <div class="board" id="board">${boardHtml()}</div>
    <button class="btn ghost" id="again">${esc(t().again)}</button>
    <p class="brandline">${esc(t().brand)} &middot; ${esc(L(pack.title))}</p>
  </div>`;
  bindLangPills(); bindCtl();
  document.getElementById("again").onclick = ()=>{ renderEnd.fx=false; renderJoin(); };
}
function boardHtml(){
  const src = cloudRows;
  const icon = src ? "🌍" : "📱";
  const rows = (src || localRows()).slice(0,10);
  const head = `<div class="boardtitle">${esc(t().board)} ${icon}${
    saveState==="saving" && SUPA_URL ? ` <span class="srcpill">${esc(t().saving)}</span>` : ""}</div>`;
  if(!rows.length) return head + `<div class="brow"><span>${esc(t().noScores)}</span><span></span></div>`;
  return head + rows.map((r,i)=>{
    const mine = myRow && r.name===myRow.name && r.score===myRow.score;
    return `<div class="brow${mine?" me":""}"><span>${i+1}. ${esc(r.name)}</span><span>${r.score}</span></div>`;
  }).join("");
}
function localRows(){
  const all = store.get("scores", {});
  return (all[SESSION]||[]).slice().sort((a,b)=>b.score-a.score);
}
function pushLocal(rec){
  const all = store.get("scores", {});
  const list = all[SESSION] || (all[SESSION]=[]);
  list.push(rec);
  list.sort((a,b)=>b.score-a.score);
  all[SESSION] = list.slice(0,50);
  store.set("scores", all);
}

/* ---------------- Supabase (graceful offline fallback) ---------------- */
function headers(extra){
  return Object.assign({ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY }, extra||{});
}
async function cloudTop(){
  if(!SUPA_URL || !SUPA_KEY) return null;
  try{
    const url = SUPA_URL + "/rest/v1/dm_scores?select=name,score,correct,total"
      + "&session=eq." + encodeURIComponent(SESSION)
      + "&order=score.desc&limit=50";
    const r = await fetch(url, { headers: headers() });
    if(!r.ok) return null;
    const rows = await r.json();
    return Array.isArray(rows) ? rows : null;
  }catch(e){ return null; }
}
async function cloudSave(rec){
  if(!SUPA_URL || !SUPA_KEY) return false;
  try{
    const r = await fetch(SUPA_URL + "/rest/v1/dm_scores", {
      method:"POST",
      headers: headers({ "Content-Type":"application/json", Prefer:"return=minimal" }),
      body: JSON.stringify(rec)
    });
    return r.ok;
  }catch(e){ return false; }
}
async function submitScore(){
  const rec = { session:SESSION, name:playerName, score,
                correct:correctCount, total:pack.questions.length };
  myRow = rec;
  pushLocal(rec);
  saveState = "saving";
  await cloudSave(rec);
  saveState = "idle";
  cloudRows = await cloudTop();
  const el = document.getElementById("board");
  if(el && phase==="end") el.innerHTML = boardHtml();
}

/* ---------------- host view (beamer) ---------------- */
let hostTimer = 0, hostRows = [];
function joinUrl(){
  return location.origin + location.pathname + "?session=" + encodeURIComponent(SESSION);
}
function qrSvg(text){
  try{
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({ cellSize:8, margin:0, scalable:true });
  }catch(e){ return `<p class="joinurl">${esc(text)}</p>`; }
}
function startHost(){
  phase = "host";
  renderHost();
  pollHost();
  hostTimer = setInterval(pollHost, 4000);
}
async function pollHost(){
  const rows = await cloudTop();
  if(rows){ hostRows = rows; }
  if(phase==="host") paintHostBoard();
}
function renderHost(){
  const title = L(pack.title) || L(registry[SESSION].title) || SESSION;
  app.innerHTML = `<div class="hostwrap">
    <div class="hostleft">
      <div class="kicker">${esc(t().brand)} &middot; ${esc(t().quiz)}</div>
      <h1>${esc(title)}</h1>
      <p class="scanlbl">${esc(t().scanTitle)}</p>
      <div class="qrcard">${qrSvg(joinUrl())}</div>
      <p class="joinurl">${esc(joinUrl())}</p>
    </div>
    <div class="hostright">
      <div class="hoststats">
        <div><p class="metriclbl">${esc(t().players)}</p><p class="bignum" id="hplayers">0</p></div>
        <div><p class="metriclbl">${esc(t().topScore)}</p><p class="bignum" id="htop">–</p></div>
      </div>
      <div class="hostboard" id="hboard"></div>
    </div>
  </div>
  <div class="hostfoot">${esc(CFG.build||"")}</div>`;
  paintHostBoard();
}
function paintHostBoard(){
  const board = document.getElementById("hboard");
  const pl = document.getElementById("hplayers");
  const tp = document.getElementById("htop");
  if(!board) return;
  const rows = hostRows.slice(0,10);
  if(pl) pl.textContent = hostRows.length;
  if(tp) tp.textContent = hostRows.length ? hostRows[0].score : "–";
  board.innerHTML = rows.length
    ? rows.map((r,i)=>`<div class="hrow${i===0?" top1":""}">
        <span class="rk">${i+1}</span>
        <span class="nm">${esc(r.name)}</span>
        <span class="cr">${r.correct}/${r.total}</span>
        <span class="sc">${r.score}</span>
      </div>`).join("")
    : `<div class="hostempty">${esc(t().waiting)}</div>`;
}

/* ---------------- sound control ---------------- */
function ctl(){
  return `<button class="iconbtn" id="sb" aria-pressed="${soundOn}" title="Sound">${
    soundOn ? "🔊" : "🔇"}</button>`;
}
function bindCtl(){
  const sb = document.getElementById("sb");
  if(sb) sb.onclick = ()=>setSound(!soundOn);
}
function setSound(v){
  soundOn=v; A.mute(!v); store.set("sound", v);
  if(v){ A.ensure(); A.unlock(); if(phase!=="join" && phase!=="picker") A.music(); }
  document.querySelectorAll("#sb").forEach(b=>{
    b.textContent = v ? "🔊" : "🔇";
    b.setAttribute("aria-pressed", v);
  });
}

/* ---------------- audio engine (all synthesized, offline) ----------------
   Carried over unchanged from noeggi-kahoot, minus the bonus-unlock cue.
   The SILENT loop is the iOS silent-switch unlock: an <audio> element
   playing silence puts the page in the "playback" category so WebAudio
   is audible with the hardware mute switch on. */
const A=(()=>{
  let ctx=null, mg=null, sg=null, tId=0, nextT=0, st=0, musicOn=false, muted=false, unlockEl=null;
  const SILENT="data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
  function unlock(){
    try{
      if(!unlockEl){
        unlockEl=new Audio(SILENT);
        unlockEl.loop=true;
        unlockEl.setAttribute("playsinline","");
      }
      if(!muted) unlockEl.play().catch(()=>{});
    }catch(e){}
    try{
      if(ctx){
        if(ctx.state!=="running") ctx.resume().catch(()=>{});
        const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource();
        s.buffer=b; s.connect(ctx.destination); s.start(0);
      }
    }catch(e){}
  }
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(ctx){ if(ctx.state==="suspended") ctx.resume().catch(()=>{}); return true; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return false;
      ctx=new AC();
      mg=ctx.createGain(); mg.gain.value=muted?0.0001:0.5; mg.connect(ctx.destination);
      sg=ctx.createGain(); sg.gain.value=muted?0.0001:0.9; sg.connect(ctx.destination);
      if(ctx.state!=="running") ctx.resume().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{
        if(!document.hidden && ctx && ctx.state!=="running") ctx.resume().catch(()=>{});
      });
    }catch(e){ ctx=null; return false; }
    return true;
  }
  function env(g,t0,a,d,peak){
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
  }
  function tone(dest,f0,t0,dur,type,peak,f1){
    try{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(f0,t0);
      if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
      env(g,t0,0.008,dur,peak);
      o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+0.06);
    }catch(e){}
  }
  function noise(dest,t0,dur,peak,hp){
    try{
      const b=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*dur|0),ctx.sampleRate);
      const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const n=ctx.createBufferSource(); n.buffer=b;
      const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp||5000;
      const g=ctx.createGain(); env(g,t0,0.004,dur,peak);
      n.connect(f); f.connect(g); g.connect(dest); n.start(t0);
    }catch(e){}
  }
  const ROOT=[33,29,36,31];                       // Am F C G
  const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  function step16(s,t0){
    const bar=(s>>4)&3, s16=s&15;
    if(s16===0||s16===8) tone(mg,105,t0,.09,"sine",.30,42);
    if(s16%2===1) noise(mg,t0,.03,.05,6000);
    if(s16%2===0){ const oct=(s16%4===2)?12:0; tone(mg,mtof(ROOT[bar]+12+oct),t0,.16,"triangle",.16); }
    if(s16===0){ CH[bar].forEach(m=>{ tone(mg,mtof(m+12)*0.997,t0,2.3,"sawtooth",.018); tone(mg,mtof(m+12)*1.003,t0,2.3,"sawtooth",.018); }); }
    if(s16%8===4) tone(mg,mtof(CH[bar][(s>>2)%3]+24),t0,.12,"square",.035);
  }
  function sched(){
    if(!ctx||!musicOn) return;
    if(nextT<ctx.currentTime-0.2) nextT=ctx.currentTime+0.05;
    while(nextT<ctx.currentTime+0.9){ step16(st,nextT); st=(st+1)&63; nextT+=0.15; }
  }
  return {
    ensure, unlock,
    music(){ if(!ensure()) return; if(musicOn) return;
      musicOn=true; st=0; nextT=ctx.currentTime+0.08;
      clearInterval(tId); tId=setInterval(sched,250); },
    mute(m){ muted=m;
      try{ if(unlockEl){ if(m) unlockEl.pause(); else unlockEl.play().catch(()=>{}); } }catch(e){}
      if(!ctx){ if(!m) ensure(); if(!ctx) return; }
      mg.gain.setTargetAtTime(m?0.0001:0.5, ctx.currentTime, .05);
      sg.gain.setTargetAtTime(m?0.0001:0.9, ctx.currentTime, .05);
      if(!m && ctx.state==="suspended") ctx.resume().catch(()=>{}); },
    tap(){ if(muted||!ensure())return; tone(sg,620,ctx.currentTime,.05,"square",.12,880); },
    correct(stk){ if(muted||!ensure())return; const t0=ctx.currentTime;
      [523,659,784,1046].forEach((f,i)=>tone(sg,f,t0+i*.07,.12,"square",.16));
      if(stk>=2) tone(sg,1319,t0+.30,.14,"square",.13); },
    wrong(){ if(muted||!ensure())return; const t0=ctx.currentTime;
      tone(sg,190,t0,.32,"sawtooth",.20,80); tone(sg,95,t0+.02,.30,"square",.10,60); },
    tick(alt){ if(muted||!ensure())return; tone(sg,alt?1250:940,ctx.currentTime,.035,"sine",.10); },
    timeout(){ if(muted||!ensure())return; tone(sg,170,ctx.currentTime,.5,"sawtooth",.18,60); },
    fanfare(){ if(muted||!ensure())return; const t0=ctx.currentTime;
      [[523,0],[523,.14],[659,.28],[784,.42]].forEach(p=>tone(sg,p[0],t0+p[1],.13,"square",.15));
      [523,659,784,1046].forEach(f=>tone(sg,f,t0+.60,.7,"square",.07)); }
  };
})();


/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e=>{
  if(phase==="question" && ["1","2","3","4"].includes(e.key)){
    const b = app.querySelectorAll(".tile")[+e.key-1];
    if(b) pick(+b.dataset.oi);
  } else if(phase==="reveal" && (e.key==="Enter" || e.key===" ")){
    e.preventDefault();
    const n = document.getElementById("next");
    if(n) n.click();
  }
});
window.addEventListener("pointerdown", ()=>{ A.ensure(); A.unlock(); }, {passive:true});
window.addEventListener("touchend",    ()=>{ A.unlock(); }, {passive:true});

boot();
</script>
</body>
</html>
