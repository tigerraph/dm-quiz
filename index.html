/* ---------------- canvas fingerprint ----------------
   A rescue HINT, never an identity: Safari and iOS add noise to canvas
   output on purpose, so equal hashes mean "probably the same browser" and
   unequal hashes mean nothing. Everything it triggers asks the person first. */
let _fp = null;
function canvasFp(){
  if(_fp !== null) return _fp;
  try{
    const c = document.createElement("canvas");
    c.width = 240; c.height = 60;
    const x = c.getContext("2d");
    x.textBaseline = "top";
    x.font = "16px 'Poppins', sans-serif";
    x.fillStyle = "#f60"; x.fillRect(120, 5, 60, 30);
    x.fillStyle = "#069"; x.fillText("DM ★ passport 🇨🇭", 4, 8);
    x.fillStyle = "rgba(102,204,0,.7)"; x.fillText("DM ★ passport 🇨🇭", 8, 28);
    const g = x.createLinearGradient(0, 0, 240, 0);
    g.addColorStop(0, "#a8d272"); g.addColorStop(1, "#435cc6");
    x.fillStyle = g; x.fillRect(0, 44, 240, 12);
    x.beginPath(); x.arc(60, 30, 20, 0, Math.PI*1.7); x.stroke();
    _fp = "c" + hash32(c.toDataURL()).toString(36);
  }catch(e){ _fp = ""; }
  return _fp;
}

/* ---------------- fingerprint rescue ----------------
   After a join, look for players with the same name and the same
   fingerprint whose tokens are not yet connected to this device and who
   own stars. If found, offer — never assume — to link them. */
let rescue = null;    // {tokens, count, date}
async function checkRescue(){
  rescue = null;
  const fp = canvasFp();
  if(!fp || !myName) return;
  const rows = await sbGet("dm_players?name=eq."+encodeURIComponent(myName)
    +"&select=token,fp&limit=200");
  if(!rows) return;
  const mine = await tokenClosure();
  const dismissed = new Set(store.get("rescue_no", []));
  const cand = [...new Set(rows
    .filter(r => r.fp === fp && !mine.has(r.token) && !dismissed.has(r.token))
    .map(r => r.token))];
  if(!cand.length) return;
  const stars = await sbGet("dm_stars?token=in.("
    + cand.map(encodeURIComponent).join(",") + ")&select=token,awarded_on&limit=200");
  if(!stars || !stars.length) return;
  rescue = {
    tokens: [...new Set(stars.map(s=>s.token))],
    count: stars.length,
    date: fmtDate(stars.map(s=>s.awarded_on).sort().pop())
  };
  paintRescue();
}
function rescueHtml(){
  if(!rescue) return "";
  return `<div class="rescue" id="rescue">
    <p>${esc(t().rescueQ(myName, rescue.date, rescue.count))}</p>
    <div class="row">
      <button class="btn small" id="ryes">${esc(t().rescueYes)}</button>
      <button class="btn ghost small" id="rno">${esc(t().rescueNo)}</button>
    </div></div>`;
}
function paintRescue(){
  const slot = document.getElementById("rescueslot");
  if(!slot || !rescue) return;
  slot.innerHTML = rescueHtml();
  document.getElementById("ryes").onclick = async ()=>{
    A.tap();
    for(const tok of rescue.tokens){
      await sbInsert("dm_token_links",
        { token_a: DEVICE, token_b: tok, method:"fingerprint" }, { conflictOk:true });
    }
    rescue = null;
    slot.innerHTML = `<div class="banner good">${esc(t().rescued)}</div>`;
  };
  document.getElementById("rno").onclick = ()=>{
    const no = store.get("rescue_no", []);
    store.set("rescue_no", [...new Set(no.concat(rescue.tokens))]);
    rescue = null;
    slot.innerHTML = "";
  };
}

/* ---------------- account (Supabase Auth, email + password) ----------------
   Raw GoTrue REST, no SDK — matches the app's dependency-free style. The
   account's only job is to link this device id to a user, so stars survive
   a lost phone: dm_identities rows are written on signup/login, and the
   passport closure picks up every token the account has ever touched. */
let AUTH = store.get("auth", null);   // {at, rt, uid, email}
async function authReq(path, body, bearer){
  try{
    const r = await fetch(SUPA_URL+"/auth/v1/"+path, {
      method: body === undefined ? "GET" : (path === "user" ? "PUT" : "POST"),
      headers: Object.assign({ apikey:SUPA_KEY, "Content-Type":"application/json" },
        bearer ? { Authorization:"Bearer "+bearer } : {}),
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    let j = null;
    try{ j = await r.json(); }catch(e){}
    return { ok:r.ok, status:r.status, j };
  }catch(e){ return null; }
}
function setAuth(j){
  AUTH = { at:j.access_token, rt:j.refresh_token,
           uid:j.user && j.user.id, email:j.user && j.user.email };
  store.set("auth", AUTH);
  linkDeviceToUser();
}
function clearAuth(){ AUTH = null; store.set("auth", null); }
async function linkDeviceToUser(){
  if(!AUTH || !AUTH.uid) return;
  try{
    await fetch(SUPA_URL+"/rest/v1/dm_identities", {
      method:"POST",
      headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+AUTH.at,
                "Content-Type":"application/json", Prefer:"return=minimal" },
      body: JSON.stringify({ user_id:AUTH.uid, token:DEVICE })
    });
  }catch(e){}
}
async function authRefresh(){
  if(!AUTH || !AUTH.rt) return;
  const r = await authReq("token?grant_type=refresh_token", { refresh_token:AUTH.rt });
  if(r && r.ok && r.j && r.j.access_token) setAuth(r.j);
  else if(r && (r.status===400 || r.status===401)) clearAuth();
}

/* account block on the My DM page (sketch: name, email, change PW, delete)
   A real <form> with visible labels, name attributes and the right
   autocomplete pair per mode — username + new-password on signup,
   username + current-password on login — is what makes iOS/Android/1Password
   offer a generated password and later autofill (Rafa review, 28.8.). */
let acctMode = "";    // "" | "pw"
let acctMsg = null;   // {text, err}
let acctAuth = "";    // "" (decide on first render) | "signup" | "login"
let acctEmail = "";   // survives re-renders, so an error never wipes the field
function acctHtml(){
  const msg = `<p class="msg ${acctMsg && acctMsg.err ? "err" : ""}">${esc(acctMsg ? acctMsg.text : "")}</p>`;
  if(AUTH){
    return `<div class="acct">
      <p class="rules">${esc(t().loggedInAs(AUTH.email || ""))}</p>
      ${acctMode==="pw" ? `
        <form id="apwform" style="display:contents">
          <input type="email" name="email" autocomplete="username" value="${esc(AUTH.email||"")}" hidden>
          <label for="anewpw">${esc(t().newPw)}</label>
          <input id="anewpw" name="password" type="password" autocomplete="new-password"
                 required minlength="6" placeholder="${esc(t().newPw)}">
          <div class="row">
            <button type="submit" class="btn small">${esc(t().save)}</button>
            <button type="button" class="btn ghost small" id="acancel">${esc(t().cancel)}</button>
          </div>
        </form>` : `
        <div class="row">
          <button class="btn ghost small" id="achangepw">${esc(t().changePw)}</button>
          <button class="btn ghost small" id="alogout">${esc(t().logout)}</button>
          <button class="btn small danger" id="adelete">${esc(t().deleteAccount)}</button>
        </div>`}
      ${msg}
    </div>`;
  }
  if(!acctAuth) acctAuth = store.get("had_auth", false) ? "login" : "signup";
  const su = acctAuth==="signup";
  return `<form class="acct" id="aform">
    <p class="rules">${esc(t().accountHint)}</p>
    <label for="aemail">${esc(t().email)}</label>
    <input id="aemail" name="email" type="email" autocomplete="username" inputmode="email"
           autocapitalize="none" spellcheck="false" required
           value="${esc(acctEmail)}" placeholder="${esc(t().email)}">
    <label for="apw">${esc(t().pw)}</label>
    <input id="apw" name="password" type="password" required minlength="6"
           autocomplete="${su ? "new-password" : "current-password"}" placeholder="${esc(t().pw)}">
    <div class="row">
      <button type="submit" class="btn small">${esc(su ? t().signup : t().login)}</button>
      <button type="button" class="btn ghost small" id="aswitch">${esc(su ? t().login : t().signup)}</button>
    </div>
    ${msg}
  </form>`;
}
function setAcctMsg(text, err){ acctMsg = text ? { text, err } : null; renderPassport(); }
function authOk(j){ store.set("had_auth", true); acctEmail=""; setAuth(j); setAcctMsg(""); }
function bindAcct(){
  const el = id => document.getElementById(id);
  if(el("aform")) el("aform").onsubmit = async e=>{
    e.preventDefault();
    const em = (el("aemail").value || "").trim(), p = el("apw").value || "";
    acctEmail = em;
    if(!em) return setAcctMsg(t().authFailed, true);
    if(p.length < 6) return setAcctMsg(t().pwShort, true);
    if(acctAuth==="signup"){
      const r = await authReq("signup", { email:em, password:p });
      if(r && r.ok && r.j && r.j.access_token) authOk(r.j);
      // "Confirm email" on: signup returns a user but no session yet
      else if(r && r.ok && r.j && (r.j.confirmation_sent_at
            || (r.j.user && r.j.user.confirmation_sent_at))) setAcctMsg(t().confirmSent);
      // tell the person what actually went wrong — the generic line sent
      // Rafa in circles when his email already had an account
      else if(r && r.j && (r.j.error_code==="user_already_exists"
            || /already registered/i.test(r.j.msg||""))){
        acctAuth="login"; setAcctMsg(t().emailTaken, true);
      }
      else if(r && r.j && r.j.error_code==="weak_password") setAcctMsg(t().pwShort, true);
      else setAcctMsg(t().authFailed, true);
    } else {
      const r = await authReq("token?grant_type=password", { email:em, password:p });
      if(r && r.ok && r.j && r.j.access_token) authOk(r.j);
      else setAcctMsg(t().authFailed, true);
    }
  };
  if(el("aswitch")) el("aswitch").onclick = ()=>{
    acctEmail = (el("aemail").value || "").trim();
    acctAuth = acctAuth==="signup" ? "login" : "signup";
    acctMsg = null; renderPassport();
  };
  if(el("achangepw")) el("achangepw").onclick = ()=>{ acctMode="pw"; renderPassport(); };
  if(el("acancel"))   el("acancel").onclick   = ()=>{ acctMode="";   renderPassport(); };
  if(el("apwform"))   el("apwform").onsubmit  = async e=>{
    e.preventDefault();
    const p = el("anewpw").value || "";
    if(p.length < 6) return setAcctMsg(t().pwShort, true);
    let r = await authReq("user", { password:p }, AUTH.at);
    if(r && r.status === 401){          // access token expired: refresh, retry once
      await authRefresh();
      if(AUTH) r = await authReq("user", { password:p }, AUTH.at);
    }
    if(r && r.ok){ acctMode=""; setAcctMsg(t().pwChanged); }
    else setAcctMsg(t().authFailed, true);
  };
  if(el("alogout")) el("alogout").onclick = async ()=>{
    try{ await authReq("logout", {}, AUTH.at); }catch(e){}
    clearAuth(); acctMode=""; setAcctMsg("");
  };
  if(el("adelete")) el("adelete").onclick = async ()=>{
    if(!confirm(t().deleteConfirm)) return;
    // The database is insert-only for anon, so deletion runs behind the
    // delete-account edge function (service role). Not deployed -> soft fail.
    let ok = false;
    try{
      const r = await fetch(SUPA_URL+"/functions/v1/delete-account", {
        method:"POST", headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+AUTH.at } });
      ok = r.ok;
    }catch(e){}
    if(ok){ clearAuth(); acctMode=""; setAcctMsg(t().deleted); }
    else setAcctMsg(t().deleteFailed, true);
  };
}

/* ---------------- passport data ----------------
   A person's stars are the stars of every token connected to this device:
   the device id, any per-session quiz tokens in localStorage, the tokens
   the account has linked (dm_identities), and whatever dm_token_links
   joins onto those. The closure is computed here — a few hundred rows at
   most. */
function myTokens(){
  const toks = new Set([DEVICE]);
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith("dmq_token_")){
        try{ const v = JSON.parse(localStorage.getItem(k)); if(v) toks.add(v); }catch(e){}
      }
    }
  }catch(e){}
  if(myToken) toks.add(myToken);
  return toks;
}
async function tokenClosure(){
  const mine = myTokens();
  if(AUTH && AUTH.uid){
    const ids = await sbGet("dm_identities?user_id=eq."+encodeURIComponent(AUTH.uid)
      +"&select=token&limit=200");
    if(ids) ids.forEach(r=>mine.add(r.token));
  }
  const links = await sbGet("dm_token_links?select=token_a,token_b&limit=2000");
  if(links){
    let grew=true;
    while(grew){
      grew=false;
      for(const l of links){
        const a=mine.has(l.token_a), b=mine.has(l.token_b);
        if(a && !b){ mine.add(l.token_b); grew=true; }
        else if(b && !a){ mine.add(l.token_a); grew=true; }
      }
    }
  }
  return mine;
}
async function fetchMyStars(){
  const mine = await tokenClosure();
  const list = [...mine].map(encodeURIComponent).join(",");
  return sbGet("dm_stars?token=in.("+list+")"
    +"&select=id,pillar,topic,session,awarded_on,source&order=awarded_on.asc&limit=500");
}
function mergeStars(local, remote){
  const by = new Map();
  for(const s of local) by.set(s.session ? "s:"+s.session : "m:"+(s.id||""), s);
  for(const s of remote||[]) by.set(s.session ? "s:"+s.session : "m:"+(s.id||""), s);
  return [...by.values()];
}

/* ---------------- passport view ---------------- */
let demoProfile = 1;
const DEMO_SPECS = [[2,1,0],[3,3,3],[6,6,5]];   // mid-way, Champion, almost Master
function demoStars(){
  const spec = DEMO_SPECS[demoProfile];
  const out=[];
  let n=0;
  PILLAR_IDS.forEach((p,pi)=>{
    for(let i=0;i<spec[pi];i++){
      const d = new Date(2026, 0 + n, 28);
      n++;
      out.push({ pillar:p, topic:"Demo",
        awarded_on:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` });
    }
  });
  return out;
}
function renderPassport(){
  phase="passport";
  paintPassport(DEMO ? demoStars() : mergeStars(localStars(), null));
  if(!DEMO && SUPA_URL){
    // Refresh only the star grid when the data lands — a full repaint here
    // would wipe whatever the user is typing into the account form.
    fetchMyStars().then(remote=>{
      if(phase==="passport" && remote) paintPassGrid(mergeStars(localStars(), remote));
    });
  }
}
function passGridHtml(stars){
  const byP = {}; PILLAR_IDS.forEach(p=>byP[p]=[]);
  for(const s of stars) if(byP[s.pillar]) byP[s.pillar].push(s);
  const counts = PILLAR_IDS.map(p=>byP[p].length);
  const isMaster   = counts.every(c=>c>=MASTER_PER_PILLAR);
  const isChampion = counts.every(c=>c>=CHAMPION_PER_PILLAR);
  const target = c => c>=CHAMPION_PER_PILLAR ? MASTER_PER_PILLAR : CHAMPION_PER_PILLAR;
  return `<div class="passgrid">
      ${PILLAR_IDS.map(p=>{
        const got = byP[p], tg = target(got.length);
        // session materials, linked under the stars that have a content page
        const mats = [...new Set(got.map(s=>s.session)
          .filter(id=>id && registry && registry[id] && registry[id].materials))];
        return `<div class="pillcard"><b>${esc(L(PILLARS[p]))}</b>
          <div class="starrow">
            ${got.map((s,i)=>`<span class="starcol on${
                justClaimed && p===justClaimedPillar && i===got.length-1 ? " new" : ""
              }" title="${esc(s.topic||"")}">★<small>${esc(fmtDate(s.awarded_on))}</small></span>`).join("")}
            ${Array.from({length:Math.max(0, tg-got.length)},
              ()=>`<span class="starcol off">☆<small>&nbsp;</small></span>`).join("")}
          </div>
          ${mats.map(id=>`<a class="matlink" target="_blank" rel="noopener"
            href="content/${encodeURIComponent(id)}.html">📖 ${esc(L(registry[id].title)||id)}</a>`).join("")}
          </div>`;
      }).join("")}
    </div>
    ${isMaster ? `<span class="lvlbadge">${esc(t().master)} ★★</span>`
      : isChampion ? `<span class="lvlbadge">${esc(t().champion)} ★</span>` : ""}
    <p class="rules">${esc(stars.length ? t().champRule : t().noStarsYet)}</p>`;
}
function paintPassGrid(stars){
  const slot = document.getElementById("passgridslot");
  if(slot) slot.innerHTML = passGridHtml(stars);
}
function paintPassport(stars){
  const waiting = !DEMO && SESSION && LIVE && pollId
    && (!liveState || liveState.phase==="done" || !liveState.phase);
  app.innerHTML = `<div class="corner">${ctl()}</div>
  <div class="screen">
    ${langPills()}
    ${wordmarkHtml("", t().curriculum)}
    <h1>${esc(t().myDM)}</h1>
    <p class="sub">${myName && !nameEdit ? esc(myName)+" · " : ""}${esc(t().passportSub)}</p>
    ${DEMO ? "" : nameEdit ? `
      <div class="namewrap"><input id="pname" maxlength="14" value="${esc(myName)}"
        placeholder="${esc(t().namePh)}" autocomplete="nickname" enterkeyhint="done"></div>
      <div class="pills">
        <button class="btn small" id="nsave">${esc(t().save)}</button>
        <button class="btn ghost small" id="ncancel">${esc(t().cancel)}</button>
      </div>`
      : `<button class="btn ghost small" id="nedit">✎ ${esc(t().rename)}</button>`}
    ${justClaimed ? `<div class="banner good">${esc(t().claimedTitle)}</div>` : ""}
    <div id="passgridslot" style="display:contents">${passGridHtml(stars)}</div>
    ${!DEMO && pack && reviewData() ? `<button class="btn ghost small" id="reviewbtn">📝 ${esc(t().reviewBtn)}</button>` : ""}
    ${DEMO ? `<div class="pills">${DEMO_SPECS.map((s,i)=>
        `<button class="pill ${i===demoProfile?"on":""}" data-demo="${i}">${s.reduce((a,b)=>a+b,0)} ★</button>`).join("")}
      </div><p class="rules">${esc(t().demoNote)}</p>` : ""}
    ${DEMO ? "" : acctHtml()}
    ${waiting ? `<p class="rules waitdot">${esc(t().waitingSession)}</p>` : ""}
    ${passBack ? `<button class="btn ghost small" id="pback">${esc(t().back)}</button>` : ""}
  </div>`;
  bindLangPills(); bindCtl(); bindAcct();
  const rb=document.getElementById("reviewbtn");
  if(rb) rb.onclick=()=>renderReview();
  app.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{
    demoProfile=+b.dataset.demo; renderPassport(); });
  const pb=document.getElementById("pback");
  if(pb) pb.onclick=()=>{ const f=passBack; passBack=null; justClaimed=false; f(); };
  // name editing (sketch: Name field on My DM). Local only — the next join
  // writes the new name to the roster, newest row wins.
  const ne=document.getElementById("nedit");
  if(ne) ne.onclick=()=>{ nameEdit=true; renderPassport(); };
  const saveName=()=>{
    const v=(document.getElementById("pname").value||"").trim().slice(0,14);
    if(v){ myName=v; store.set("name", v); }
    nameEdit=false; renderPassport();
  };
  const ns=document.getElementById("nsave");
  if(ns) ns.onclick=saveName;
  const ni=document.getElementById("pname");
  if(ni && nameEdit) ni.addEventListener("keydown", e=>{ if(e.key==="Enter") saveName(); });
  const nc=document.getElementById("ncancel");
  if(nc) nc.onclick=()=>{ nameEdit=false; renderPassport(); };
}
let nameEdit=false;

/* ---------------- quiz review (My DM) ----------------
   The player's own answers vs. the right ones, with each question's Why —
   for reading back through the quiz during the video block. */
function renderReview(){
  phase="review";
  const rev = reviewData() || { answers:{} };
  app.innerHTML = `<div class="corner">${ctl()}</div>
  <div class="screen">
    ${langPills()}
    ${wordmarkHtml()}
    <h1>${esc(t().reviewTitle)}</h1>
    <p class="sub">${esc(sessionTitle())}</p>
    <div class="revlist">
      ${pack.questions.map((q,qi)=>{
        const opts = L(q.o);
        const has = Object.prototype.hasOwnProperty.call(rev.answers, qi);
        const choice = has ? rev.answers[qi] : null;
        const ok = choice!=null && choice===q.correct;
        const why = L(q.explanation);
        return `<div class="revcard">
          <b class="rk">${esc(t().qof(qi+1, pack.questions.length))}
            <span class="${ok?"okmark":"badmark"}">${ok?"✓":"✕"}</span></b>
          <p class="rq">${esc(L(q.q))}</p>
          <p class="ra">${esc(t().yourAnswer)} <b>${esc(choice==null ? t().noAnswer : opts[choice])}</b></p>
          ${ok ? "" : `<p class="ra">${esc(t().answerWas)} <b>${esc(opts[q.correct])}</b></p>`}
          ${why ? `<p class="rw"><b>${esc(t().why)}</b>${esc(why)}</p>` : ""}
        </div>`;
      }).join("")}
    </div>
    <button class="btn ghost small" id="rback">${esc(t().back)}</button>
  </div>`;
  bindLangPills(); bindCtl();
  document.getElementById("rback").onclick = ()=>renderPassport();
}

/* ---------------- host: claim window + manual add ---------------- */
function renderHostStars(){
  phase="hoststars";
  const pillar = pillarOf();
  app.innerHTML = `<div class="hostwrap">
    <div class="hostleft">
      ${wordmarkHtml("", t().curriculum)}
      <h1>${esc(sessionTitle())}</h1>
      <p class="scanlbl">${esc(t().claimScan)}</p>
      <div class="qrcard">${qrSvg(joinUrl())}</div>
      <p class="joinurl">${esc(joinUrl())}</p>
    </div>
    <div class="hostright">
      <div class="hoststats">
        <div><p class="metriclbl">${esc(pillar ? L(PILLARS[pillar]) : "")}</p>
             <p class="bignum" id="hstars">0</p></div>
      </div>
      <p class="scanlbl" id="hstarlbl"></p>
      <div class="roster" id="hclaimed"></div>
    </div>
  </div>
  <div class="hostbar">
    <button class="btn" id="hagain">${esc(t().restart)}</button>
    <button class="btn ghost" id="haddstar">${esc(t().addStar)}</button>
  </div>
  <div class="hostfoot">${esc(CFG.build||"")}</div>`;
  document.getElementById("hagain").onclick = async ()=>{
    A.tap(); answers=[];
    await pushState("lobby", -1, curRound()+1);
    renderHost();
  };
  document.getElementById("haddstar").onclick = openAddStar;
  document.getElementById("hclear").onclick = async ()=>{
    if(!livePlayers().length) return;
    if(!confirm(t().clearConfirm(livePlayers().length))) return;
    A.tap();
    roster = []; answers = [];
    await pushState("lobby", -1, curRound()+1);
    renderHost();
  };
  paintHostStars();
}
function paintHostStars(){
  const c=document.getElementById("hstars"), l=document.getElementById("hstarlbl"),
        r=document.getElementById("hclaimed");
  if(c) c.textContent = sessionStars.length;
  if(l) l.textContent = t().starsCount(sessionStars.length);
  if(r) r.innerHTML = sessionStars.map(s=>`<span class="chip">★ ${esc(s.name)}</span>`).join("");
}
async function openAddStar(){
  A.tap();
  // anyone who has ever joined any session, newest first, one entry per device
  const all = await sbGet("dm_players?select=token,name,session,joined_at"
    +"&order=joined_at.desc&limit=1000") || [];
  const seen = new Map();
  for(const p of all) if(!seen.has(p.token)) seen.set(p.token, p);
  const people = [...seen.values()];
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = `<form>
    <label>${esc(t().mWho)}</label>
    <select id="mwho">${people.map(p=>
      `<option value="${esc(p.token)}">${esc(p.name)} — ${esc(p.session)}</option>`).join("")}</select>
    <label>${esc(t().mPillar)}</label>
    <select id="mpillar">${PILLAR_IDS.map(p=>
      `<option value="${p}">${esc(L(PILLARS[p]))}</option>`).join("")}</select>
    <label>${esc(t().mTopic)}</label><input id="mtopic" maxlength="60">
    <label>${esc(t().mDate)}</label><input id="mdate" type="date">
    <div class="row">
      <button type="button" class="btn ghost small" id="mcancel">${esc(t().cancel)}</button>
      <button type="submit" class="btn small">${esc(t().mAdd)}</button>
    </div>
  </form>`;
  document.body.appendChild(sheet);
  const close = ()=>sheet.remove();
  sheet.addEventListener("click", e=>{ if(e.target===sheet) close(); });
  sheet.querySelector("#mcancel").onclick = close;
  sheet.querySelector("form").onsubmit = async e=>{
    e.preventDefault();
    const tok = sheet.querySelector("#mwho").value;
    if(!tok) return;
    const row = {
      token: tok,
      name: (seen.get(tok)||{}).name || "?",
      pillar: sheet.querySelector("#mpillar").value,
      topic: sheet.querySelector("#mtopic").value.trim() || null,
      source: "manual"
    };
    const d = sheet.querySelector("#mdate").value;
    if(d) row.awarded_on = d;
    if(await sbInsert("dm_stars", row)){ A.tap(); close(); }
  };
}

/* ---------------- rerender on language switch ---------------- */
function rerender(){
  if(phase==="picker") renderPicker();
  else if(phase==="error") renderError();
  else if(phase==="join") renderJoin();
  else if(phase==="passport") renderPassport();
  else if(phase==="review") renderReview();
  else if(phase==="claim") renderClaim();
  else if(HOST) renderHost();
  else if(phase==="lobby") renderPlayerLobby();
  else if(phase==="question") LIVE ? renderPlayerQuestion() : renderSoloQuestion();
  else if(phase==="locked") renderPlayerLocked();
  else if(phase==="reveal") LIVE ? paintPlayerReveal() : renderSoloReveal();
  else if(phase==="done") LIVE ? renderPlayerDone() : renderSoloDone();
}

/* ---------------- audio engine (all synthesized, offline) ----------------
   Carried over unchanged from noeggi-kahoot, minus the bonus-unlock cue.
   The SILENT loop is the iOS silent-switch unlock: an <audio> element
   playing silence puts the page in the "playback" category so WebAudio
   is audible with the hardware mute switch on. */
const A=(()=>{
  let ctx=null, mg=null, sg=null, tId=0, nextT=0, st=0, musicOn=false, muted=false, unlockEl=null;
  const SILENT="data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
  function unlock(){
    try{
      if(!unlockEl){
        unlockEl=new Audio(SILENT);
        unlockEl.loop=true;
        unlockEl.setAttribute("playsinline","");
      }
      if(!muted) unlockEl.play().catch(()=>{});
    }catch(e){}
    try{
      if(ctx){
        if(ctx.state!=="running") ctx.resume().catch(()=>{});
        const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource();
        s.buffer=b; s.connect(ctx.destination); s.start(0);
      }
    }catch(e){}
  }
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(ctx){ if(ctx.state==="suspended") ctx.resume().catch(()=>{}); return true; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return false;
      ctx=new AC();
      mg=ctx.createGain(); mg.gain.value=muted?0.0001:0.5; mg.connect(ctx.destination);
      sg=ctx.createGain(); sg.gain.value=muted?0.0001:0.9; sg.connect(ctx.destination);
      if(ctx.state!=="running") ctx.resume().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{
        if(!document.hidden && ctx && ctx.state!=="running") ctx.resume().catch(()=>{});
      });
    }catch(e){ ctx=null; return false; }
    return true;
  }
  function env(g,t0,a,d,peak){
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);
  }
  function tone(dest,f0,t0,dur,type,peak,f1){
    try{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(f0,t0);
      if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
      env(g,t0,0.008,dur,peak);
      o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+0.06);
    }catch(e){}
  }
  function noise(dest,t0,dur,peak,hp){
    try{
      const b=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*dur|0),ctx.sampleRate);
      const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const n=ctx.createBufferSource(); n.buffer=b;
      const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp||5000;
      const g=ctx.createGain(); env(g,t0,0.004,dur,peak);
      n.connect(f); f.connect(g); g.connect(dest); n.start(t0);
    }catch(e){}
  }
  const ROOT=[33,29,36,31];                       // Am F C G
  const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  function step16(s,t0){
    const bar=(s>>4)&3, s16=s&15;
    if(s16===0||s16===8) tone(mg,105,t0,.09,"sine",.30,42);
    if(s16%2===1) noise(mg,t0,.03,.05,6000);
    if(s16%2===0){ const oct=(s16%4===2)?12:0; tone(mg,mtof(ROOT[bar]+12+oct),t0,.16,"triangle",.16); }
    if(s16===0){ CH[bar].forEach(m=>{ tone(mg,mtof(m+12)*0.997,t0,2.3,"sawtooth",.018); tone(mg,mtof(m+12)*1.003,t0,2.3,"sawtooth",.018); }); }
    if(s16%8===4) tone(mg,mtof(CH[bar][(s>>2)%3]+24),t0,.12,"square",.035);
  }
  function sched(){
    if(!ctx||!musicOn) return;
    if(nextT<ctx.currentTime-0.2) nextT=ctx.currentTime+0.05;
    while(nextT<ctx.currentTime+0.9){ step16(st,nextT); st=(st+1)&63; nextT+=0.15; }
  }
  return {
    ensure, unlock,
    music(){ if(!ensure()) return; if(musicOn) return;
      musicOn=true; st=0; nextT=ctx.currentTime+0.08;
      clearInterval(tId); tId=setInterval(sched,250); },
    mute(m){ muted=m;
      try{ if(unlockEl){ if(m) unlockEl.pause(); else unlockEl.play().catch(()=>{}); } }catch(e){}
      if(!ctx){ if(!m) ensure(); if(!ctx) return; }
      mg.gain.setTargetAtTime(m?0.0001:0.5, ctx.currentTime, .05);
      sg.gain.setTargetAtTime(m?0.0001:0.9, ctx.currentTime, .05);
      if(!m && ctx.state==="suspended") ctx.resume().catch(()=>{}); },
    tap(){ if(muted||!ensure())return; tone(sg,620,ctx.currentTime,.05,"square",.12,880); },
    correct(stk){ if(muted||!ensure())return; const t0=ctx.currentTime;
      [523,659,784,1046].forEach((f,i)=>tone(sg,f,t0+i*.07,.12,"square",.16));
      if(stk>=2) tone(sg,1319,t0+.30,.14,"square",.13); },
    wrong(){ if(muted||!ensure())return; const t0=ctx.currentTime;
      tone(sg,190,t0,.32,"sawtooth",.20,80); tone(sg,95,t0+.02,.30,"square",.10,60); },
    tick(alt){ if(muted||!ensure())return; tone(sg,alt?1250:940,ctx.currentTime,.035,"sine",.10); },
    timeout(){ if(muted||!ensure())return; tone(sg,170,ctx.currentTime,.5,"sawtooth",.18,60); },
    fanfare(){ if(muted||!ensure())return; const t0=ctx.currentTime;
      [[523,0],[523,.14],[659,.28],[784,.42]].forEach(p=>tone(sg,p[0],t0+p[1],.13,"square",.15));
      [523,659,784,1046].forEach(f=>tone(sg,f,t0+.60,.7,"square",.07)); }
  };
})();


/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e=>{
  if(phase==="question" && !HOST && ["1","2","3","4"].includes(e.key)){
    const b = app.querySelectorAll(".tile")[+e.key-1];
    if(b && !b.disabled) b.click();
  } else if(HOST && (e.key==="Enter" || e.key===" ")){
    const b = document.querySelector(".hostbar .btn");
    if(b && !b.disabled){ e.preventDefault(); b.click(); }
  } else if(phase==="reveal" && !LIVE && (e.key==="Enter" || e.key===" ")){
    e.preventDefault();
    const n = document.getElementById("next");
    if(n) n.click();
  }
});
window.addEventListener("pointerdown", ()=>{ A.ensure(); A.unlock(); }, {passive:true});
window.addEventListener("touchend",    ()=>{ A.unlock(); }, {passive:true});
document.addEventListener("visibilitychange", ()=>{
  // a phone that was locked mid-question needs to catch up at once
  if(!document.hidden && LIVE && !HOST && pollId) tickPlayer();
});

boot();
