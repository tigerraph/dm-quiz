<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My DM · Admin</title>
<!--
  Admin view for running a session (Rafa, 18.09.2026; v3 «session setup», approved 07.10.2026 from the
  mock PESjSgJLUXdJFtqBJeVu9H): everything one click away, nothing collapsed.
    · one primary action per topic, Present ▶ (opens the slides in full-window mode, ?present=1),
      with «copy link for the moderator» next to it;
    · every file and link visible, grouped by when it is needed: before, during, after the session,
      plus the run-sheet QR for the moderator's phone;
    · one language switch for the whole page (?lang= presets it; check-topic uses that);
    · Stars & people always open in the right column (below the topics on a phone).
  Built from packs/sessions.json at runtime, so a topic added with `npm run new-topic` appears without
  an edit. `npm run check-topic` opens this page in headless Chrome once per language (?lang=) and fails
  on a missing topic, a dead link, or a QR that does not point at the topic's Regie page.
  People and their stars appear only for a logged-in admin (the My DM login, flagged in dm_admins): the
  names are readable only with an admin's token (docs/supabase-migration-005.sql), so the public page
  itself carries none.
-->
<style>
  @font-face{font-family:'Poppins';font-style:normal;font-weight:400;
    src:url(../assets/fonts/poppins-400-latin.woff2) format('woff2');font-display:swap}
  @font-face{font-family:'Poppins';font-style:normal;font-weight:700;
    src:url(../assets/fonts/poppins-800-latin.woff2) format('woff2');font-display:swap}
  :root{--bg:#111C2B;--card:#18263A;--line:#2A3A4F;--mint:#5AD1A8;--ink:#0F1B2A;--muted:#9FB0C4;--amber:#FFD166;
    --gap:20px;--pad:22px;--side:320px;--qr:84px;--radius:16px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:#fff;line-height:1.45;
    padding:28px 32px 48px;max-width:1240px;margin:0 auto}
  .wrap{container-type:inline-size}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:22px}
  .kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
  h1{font-size:30px;line-height:1.15;margin-top:4px}
  .sub{font-size:14px;color:var(--muted)}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;
    min-height:44px;margin:-10px 0 4px}
  .back:hover,.back:focus-visible{color:#fff}
  .lang{display:inline-flex;gap:6px}
  .lang button{font:700 13px Poppins,system-ui,sans-serif;color:#fff;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;min-width:44px;min-height:40px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--mint);color:var(--ink);border-color:var(--mint)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) var(--side);gap:var(--gap);align-items:start}
  .topic{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);margin-bottom:18px;
    container-type:inline-size}
  .topic h2{font-size:22px;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 8px;
    background:rgba(255,255,255,.1);color:#fff}
  .chip.next,.chip.draft{background:var(--amber);color:var(--ink)}
  .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .prim{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px;align-items:stretch}
  .btn{font:700 15px Poppins,system-ui,sans-serif;border-radius:12px;padding:12px 18px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px}
  .btn.primary{background:var(--mint);color:var(--ink);border:0;font-size:18px;padding:12px 28px}
  .btn.ghost{background:none;color:#fff;border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--mint)}
  .btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
  /* copy icon: square like the other controls; the tooltip shows on hover and keyboard focus, and
     turns into the «Copied» confirmation for a moment after a copy */
  .icon{position:relative;width:48px;min-height:48px;padding:0;flex:0 0 auto}
  .icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon .ok{display:none}
  .icon.done{border-color:var(--mint);color:var(--mint)}
  .icon.done .ok{display:block}
  .icon.done .cp{display:none}
  .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);
    font:700 12px Poppins,system-ui,sans-serif;border-radius:8px;padding:5px 9px;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .15s}
  .icon:hover .tip,.icon:focus-visible .tip,.icon.done .tip,.icon.fail .tip{opacity:1}
  .icon.fail .tip{background:var(--amber)}
  .moments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
  h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mint);margin:14px 0 8px}
  ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  li a{color:#fff;text-decoration:none;font-size:15px;border-bottom:1px solid var(--line)}
  li a:hover{border-bottom-color:var(--mint)}
  li .what{display:block;font-size:12.5px;color:var(--muted)}
  li .what a{font-size:12.5px}
  .qrline{display:flex;gap:12px;align-items:center}
  .qr{background:#fff;border-radius:10px;padding:6px;width:var(--qr);height:var(--qr);flex:none;display:flex;align-items:center;justify-content:center}
  .qr svg{width:100%;height:100%;display:block}
  .people{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;font-size:14px;color:var(--muted)}
  .people h2{font-size:18px;color:#fff}
  .people p{margin-top:8px}
  .people p a{color:#fff}
  .ptot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
  .ptot div{background:rgba(255,255,255,.06);border-radius:10px;padding:8px;text-align:center}
  .ptot b{display:block;font-size:22px;font-weight:400;color:#fff;font-variant-numeric:tabular-nums}
  .ptot span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .plist{margin-top:12px;gap:0}
  .plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .plist b{color:#fff;font-size:14.5px;overflow-wrap:anywhere}
  .plist .st{color:var(--amber);text-align:right;white-space:nowrap;font-size:13px}
  .plist small{grid-column:1 / -1;font-size:12px}
  .err{color:var(--amber)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* narrower than topics + side column: one column, people below the topics */
  @container (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
  /* narrow topic card: before / during / after stack; the run-sheet QR is for another device, so it hides */
  @container (max-width:620px){.moments{grid-template-columns:minmax(0,1fr);gap:0}.qr{display:none}}
  @media (max-width:640px){
    :root{--pad:18px;--gap:14px}
    body{padding:20px 16px 32px}
    h1{font-size:24px}
    .topic h2{font-size:19px}
    .prim .primary{flex:1 1 0}
    .tip{left:auto;right:0;transform:none;bottom:auto;top:calc(100% + 8px)}   /* below: above it would cover Present */
  }
  @media (prefers-reduced-motion:reduce){.tip{transition:none}}
</style>
<script src="../vendor/qrcode.js"></script>
</head><body>
<div class="wrap">
<header>
  <div>
    <a class="back" href="../?view=mydm">← My DM</a>
    <div class="kick">Democracy Matters · Admin</div><h1>Sessions</h1>
    <p class="sub">Check a topic, then hand it on or present it.</p>
  </div>
  <div class="lang" id="lang" role="group" aria-label="Language for every link"></div>
</header>
<div class="cols">
  <main id="topics"><p class="sub">Loading packs/sessions.json …</p></main>
  <aside class="people" id="people" aria-labelledby="ph">
    <h2 id="ph">Stars &amp; people</h2>
    <div id="pbody"><p>Checking login …</p></div>
  </aside>
</div>
</div>
<script>
(function(){
  var BASE = 'https://tigerraph.github.io/dm-quiz/';
  var LANGS = ['en','de','fr','it'];            // EN is the default slide language (Rafa, 18.09.2026)
  var PILLAR = {civics:'🏛️ Civics', comm:'📣 Communication', action:'✊ Action'};
  var q = new URLSearchParams(location.search);
  var LANG = (q.get('lang') || 'en').toLowerCase();   // ?lang= presets the page language (check-topic uses it)
  if (LANGS.indexOf(LANG) < 0) LANG = 'en';
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var pick = function(o, l){ return o ? (o[l] || o.en || o.de || Object.values(o)[0]) : ''; };
  var qs = function(l){ return l === 'de' ? '' : '?lang=' + l; };   // DE is each page's own default
  var pdf = function(base, l){ return '../slides/' + base + (l === 'de' ? '' : '.' + l) + '.pdf'; };
  var ddmm = function(iso){ var p = String(iso).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' : iso; };
  var dmy = function(iso){ var p = String(iso).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso; };
  var CP = '<svg class="cp" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>' +
           '<svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
  var cards = [];

  // one language switch for the whole page
  var langBox = document.getElementById('lang');
  function langButtons(){
    langBox.innerHTML = LANGS.map(function(l){
      return '<button type="button" data-l="' + l + '" aria-pressed="' + (l === LANG) + '">' + l.toUpperCase() + '</button>'; }).join('');
  }
  langBox.addEventListener('click', function(e){
    var b = e.target.closest('[data-l]'); if (!b) return;
    LANG = b.getAttribute('data-l'); langButtons();
    try { var u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u); } catch (err) {}
    cards.forEach(function(r){ r(); });
  });
  langButtons();

  fetch('../packs/sessions.json').then(function(r){ return r.json(); }).then(function(reg){
    var byPack = {};
    Object.keys(reg).forEach(function(k){ (byPack[reg[k].pack] = byPack[reg[k].pack] || []).push(k); });
    // one card per pack; other registry ids on the same pack (e.g. «probe») appear as rehearsal links
    // drafts last; otherwise the most recent session date first, topics without a date after them
    var packs = Object.keys(byPack).sort(function(a, b){
      var x = reg[byPack[a][0]], y = reg[byPack[b][0]];
      return ((x.draft ? 1 : 0) - (y.draft ? 1 : 0)) || String(y.date || '').localeCompare(String(x.date || ''));
    });
    return Promise.all(packs.map(function(p){
      return fetch('../packs/' + p).then(function(r){ return r.json(); }).then(function(pack){ return {pack:pack, ids:byPack[p]}; });
    })).then(function(list){ list.forEach(function(it){ card(reg, it); }); document.body.setAttribute('data-ready', '1'); });
  }).catch(function(e){ document.getElementById('topics').innerHTML = '<p class="err">Could not load packs/sessions.json: ' + esc(e.message) + '</p>'; });

  function card(reg, it){
    var main = document.getElementById('topics');
    if (!main.querySelector('.topic')) main.innerHTML = '';
    var id = it.pack.id, mainId = it.ids.indexOf(id) >= 0 ? id : it.ids[0], s = reg[mainId];
    var langs = LANGS.filter(function(l){ return it.pack.questions[0] && it.pack.questions[0].q[l]; });
    var draft = s.draft ? ' data-draft="' + esc(id) + '"' : '';   // check-topic gates a draft's links only by name
    var ext = draft + ' target="_blank" rel="noopener"';
    var a = function(href, text, what){
      return '<li><a href="' + esc(href) + '"' + ext + '>' + text + '</a>' +
        (what ? '<span class="what">' + what + '</span>' : '') + '</li>';
    };
    var el = document.createElement('article');
    el.className = 'topic'; el.id = 'topic-' + id;
    main.appendChild(el);

    function render(){
      var lang = langs.indexOf(LANG) >= 0 ? LANG : langs[0];
      var slides = BASE + 'slides/' + id + '.html' + qs(lang);
      var present = '../slides/' + id + '.html?' + (lang === 'de' ? '' : 'lang=' + lang + '&') + 'present=1';
      var regie = BASE + 'content/regie-' + id + '.html' + qs(lang);
      var host = '../?session=' + encodeURIComponent(mainId) + '&host=1';
      var practice = s.practice || [];
      // practice material with a printable PDF is prepared before the session; the rest is played during it
      var game = function(x){
        var what = (x.what ? esc(pick(x.what, lang)) : 'Game for the exercise block') +
          (x.pdf ? ' · <a href="' + esc(pdf(x.pdf, lang)) + '"' + ext + '>PDF</a>' : '');
        return a('../content/' + x.file + qs(lang), esc(pick(x.title, lang)), what);
      };
      var before = practice.filter(function(x){ return x.pdf; }).map(game).join('') +
        a(pdf('topic-card-' + id, lang), 'Topic card (PDF)', 'One-page overview, also the no-slides fallback · <a href="../slides/topic-card-' + esc(id) + '.html' + qs(lang) + '"' + ext + '>HTML</a>') +
        a(pdf(id, lang), 'Slides as PDF', 'Offline backup of the deck');
      var during = practice.filter(function(x){ return !x.pdf; }).map(game).join('') +
        a(host, 'Beamer quiz', 'Lobby with the join QR, drives the game') +
        a(host + '&award=1', 'Award the star ★', 'Opens the claim window on every phone') +
        it.ids.map(function(k){ return a('../?session=' + encodeURIComponent(k), k === mainId ? 'Quiz as player' : 'Quiz as player · ' + esc(k),
          k === mainId ? 'The link behind the QR on the slides' : 'Rehearsal alias'); }).join('');
      var after = a('../content/' + id + '.html' + qs(lang), 'Take-home page', 'For participants: bottom line, video, replay');
      var today = new Date().toISOString().slice(0, 10);
      var chip = s.draft ? '<span class="chip draft">Draft</span>'
        : s.date ? (s.date < today ? '<span class="chip">Last run ' + esc(ddmm(s.date)) + '</span>' : '<span class="chip next">Next run ' + esc(ddmm(s.date)) + '</span>') : '';
      el.innerHTML =
        '<h2>' + esc(pick(s.title, lang) || id) + ' ' + chip + '</h2>' +
        '<div class="meta">' + [PILLAR[s.pillar] || s.pillar || '', s.date ? dmy(s.date) : 'no date set',
          it.pack.questions.length + ' questions', langs.map(function(l){ return l.toUpperCase(); }).join(' / ')].filter(Boolean).map(esc).join(' · ') + '</div>' +
        '<div class="prim">' +
          '<a class="btn primary" data-act="present" href="' + esc(present) + '"' + ext + '>Present ▶</a>' +
          '<button type="button" class="btn ghost icon" data-act="copy" data-url="' + esc(slides) + '" aria-label="Copy slides link for the moderator">' +
            CP + '<span class="tip" aria-hidden="true">Copy link for the moderator</span></button>' +
          '<span class="sr" role="status" aria-live="polite"></span>' +
        '</div>' +
        '<div class="moments">' +
          '<div><h3>Before</h3><ul>' + before + '</ul></div>' +
          '<div><h3>During</h3><ul>' + during + '</ul></div>' +
          '<div><h3>After</h3><ul>' + after + '</ul>' +
            '<h3>Run sheet</h3><div class="qrline"><div class="qr" data-qr="' + esc(regie) + '"></div><ul>' +
              a(regie, 'Run sheet', 'Scan for the moderator’s phone') + '</ul></div>' +
          '</div>' +
        '</div>';
      var box = el.querySelector('[data-qr]');
      var code = qrcode(0, 'M'); code.addData(regie); code.make(); box.innerHTML = code.createSvgTag(3, 0);
      el.querySelector('[data-act=copy]').addEventListener('click', function(e){ copy(e.currentTarget, el.querySelector('.sr')); });
    }
    cards.push(render);
    render();
  }

  function copy(btn, live){
    var text = btn.getAttribute('data-url'), tip = btn.querySelector('.tip');
    var done = function(ok){
      var msg = ok ? 'Copied' : 'Copy failed: long-press Present';
      btn.classList.add(ok ? 'done' : 'fail'); tip.textContent = msg; live.textContent = msg;   // live region reads it out
      clearTimeout(btn._t);
      btn._t = setTimeout(function(){ btn.classList.remove('done', 'fail'); tip.textContent = 'Copy link for the moderator'; live.textContent = ''; }, 1600);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(legacy(text)); });
    else done(legacy(text));
  }
  function legacy(text){
    var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    t.remove(); return ok;
  }

  /* ── Stars & people: only for a logged-in admin (docs/supabase-migration-005.sql) ──
     The login is the one from My DM (same site, localStorage «dmq_auth»). Names are
     readable only with an admin's token, so nobody else gets them, whatever this page shows. */
  var PILL = {civics:'Civics', comm:'Comm', action:'Action'};
  var EMO = {civics:'🏛️', comm:'📣', action:'✊'};
  var fmt = function(d){ return d ? new Date(d).toLocaleDateString('de-CH') : ''; };
  var people = function(html){ document.getElementById('pbody').innerHTML = html; };
  var getAuth = function(){ try { return JSON.parse(localStorage.getItem('dmq_auth')); } catch (e) { return null; } };
  fetch('../src/config.json').then(function(r){ return r.json(); }).then(function(cfg){
    var URL_ = cfg.supabaseUrl, KEY = cfg.supabaseAnonKey, auth = getAuth();
    var login = '<p><a href="../?view=mydm">Log in to My DM</a> with an admin account to see people and their stars.</p>';
    if (!auth || !auth.at) return people(login);
    // DM's tables live in the schema «dm» (docs/supabase-migration-006-dm-schema.sql), picked with the
    // Accept-Profile header. Before 006 has run PostgREST refuses that profile (406 PGRST106) and the
    // read is repeated without it, against public, as in the app (rest() in src/template.html).
    var SCHEMA = cfg.supabaseSchema || 'dm', noProfile = false;
    var get = function(path){
      var h = { apikey:KEY, Authorization:'Bearer ' + auth.at };
      if (!noProfile) h['Accept-Profile'] = SCHEMA;
      return fetch(URL_ + '/rest/v1/' + path, { cache:'no-store', headers:h }).then(function(r){
        if (r.status !== 406 || noProfile) return r;
        return r.clone().json().catch(function(){ return null; }).then(function(j){
          if (!j || j.code !== 'PGRST106') return r;
          noProfile = true; return get(path);
        });
      });
    };
    var call = function(path, retried){
      return get(path).then(function(r){
        if (r.status !== 401 || retried || !auth.rt) return r;
        // expired token: refresh it the way My DM does, and keep My DM's copy in step
        return fetch(URL_ + '/auth/v1/token?grant_type=refresh_token', { method:'POST',
          headers:{ apikey:KEY, 'Content-Type':'application/json' }, body:JSON.stringify({ refresh_token:auth.rt }) })
          .then(function(t){ return t.ok ? t.json() : null; }).then(function(j){
            if (!j || !j.access_token) return r;
            auth = { at:j.access_token, rt:j.refresh_token, uid:j.user && j.user.id, email:j.user && j.user.email };
            try { localStorage.setItem('dmq_auth', JSON.stringify(auth)); } catch (e) {}
            return call(path, true);
          });
      });
    };
    return call('dm_admins?select=user_id&user_id=eq.' + encodeURIComponent(auth.uid)).then(function(r){
      if (r.status === 404) return people('<p>Waiting for the database update (docs/supabase-migration-005.sql).</p>');
      if (r.status === 401) return people(login);
      return r.json().then(function(rows){
        if (!Array.isArray(rows) || !rows.length)
          return people('<p>' + esc(auth.email || 'This account') + ' is not an admin account. <a href="../?view=mydm">My DM</a></p>');
        return Promise.all([
          call('dm_players?select=token,name,session,joined_at&order=joined_at.desc&limit=2000').then(function(x){ return x.json(); }),
          call('dm_stars?select=token,name,pillar,session,topic,awarded_on,source&order=awarded_on.desc&limit=2000').then(function(x){ return x.json(); }),
          call('dm_token_links?select=token_a,token_b&limit=5000').then(function(x){ return x.ok ? x.json() : []; })
        ]).then(function(res){ list(res[0] || [], res[1] || [], res[2] || []); });
      });
    });
  }).catch(function(e){ people('<p class="err">Could not load people: ' + esc(e.message) + '</p>'); });

  // one line per person: tokens joined by dm_token_links (device id <-> quiz tokens, rescues)
  // count as one, as they do in the passport; then latest name, stars per pillar, sessions, last seen
  function list(players, stars, links){
    var up = {};
    var root = function(t){ while (up[t]) t = up[t]; return t; };
    links.forEach(function(l){ var a = root(l.token_a), b = root(l.token_b); if (a !== b) up[a] = b; });
    var by = {}, tot = {civics:0, comm:0, action:0};
    var get = function(tok, name){ tok = root(tok); return by[tok] = by[tok] || { name:name, sessions:{}, seen:'', stars:{civics:0, comm:0, action:0}, n:0 }; };
    players.forEach(function(p){ var x = get(p.token, p.name); if (p.session) x.sessions[p.session] = 1; if (!x.seen || p.joined_at > x.seen) x.seen = p.joined_at; });
    stars.forEach(function(st){ var x = get(st.token, st.name); x.stars[st.pillar] = (x.stars[st.pillar] || 0) + 1; x.n++; if (st.pillar in tot) tot[st.pillar]++; });
    var rows = Object.keys(by).map(function(k){ return by[k]; })
      .sort(function(a, b){ return b.n - a.n || (b.seen > a.seen ? 1 : -1); });
    people(
      '<div class="ptot">' + Object.keys(PILL).map(function(p){ return '<div><b>' + tot[p] + '</b><span>' + EMO[p] + ' ' + PILL[p] + '</span></div>'; }).join('') + '</div>' +
      '<p class="meta">' + rows.length + (rows.length === 1 ? ' person · ' : ' people · ') + stars.length + (stars.length === 1 ? ' star' : ' stars') +
        ' · DM Champion: 3 stars in every pillar</p>' +
      '<ul class="plist">' + rows.map(function(x){
        var pills = Object.keys(PILL).filter(function(p){ return x.stars[p]; }).map(function(p){ return PILL[p] + ' ' + x.stars[p]; }).join(' · ');
        var ns = Object.keys(x.sessions).length;
        return '<li><b>' + esc(x.name) + '</b><span class="st">' + (pills ? esc(pills) : '—') + '</span>' +
          '<small>' + (ns ? ns + (ns === 1 ? ' session' : ' sessions') : (x.n ? '' : 'joined, no star yet')) +
          (x.seen ? ' · last seen ' + esc(fmt(x.seen)) : '') + '</small></li>';
      }).join('') + '</ul>');
  }
})();
</script>
</body></html>
